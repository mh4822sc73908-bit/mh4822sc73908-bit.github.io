\"30\" y=\"14\" width=\"4\" height=\"8\" rx=\"2\" fill=\"#6c7a80\"/><path d=\"M8 4 Q20 2 32 9\" stroke=\"#6c7a80\" stroke-width=\"2\" fill=\"none\"/><\/svg>',\nprinter:'<svg viewBox=\"0 0 64 64\"><rect x=\"18\" y=\"6\" width=\"28\" height=\"16\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"6\" y=\"20\" width=\"52\" height=\"24\" rx=\"4\" fill=\"#3b464c\"/><rect x=\"12\" y=\"26\" width=\"12\" height=\"7\" fill=\"#9fe08a\"/><circle cx=\"48\" cy=\"30\" r=\"2.5\" fill=\"#ccc\"/><rect x=\"16\" y=\"40\" width=\"32\" height=\"18\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"21\" y=\"45\" width=\"22\" height=\"2\" fill=\"#c3cbcf\"/><rect x=\"21\" y=\"50\" width=\"16\" height=\"2\" fill=\"#c3cbcf\"/><\/svg>',\nmic:'<svg viewBox=\"0 0 64 64\"><rect x=\"36\" y=\"4\" width=\"9\" height=\"20\" rx=\"4.5\" transform=\"rotate(30 40 14)\" fill=\"#6c7a80\"/><path d=\"M36 22 Q28 34 32 46\" stroke=\"#3b464c\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"32\" cy=\"54\" rx=\"16\" ry=\"5\" fill=\"#3b464c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"6\" fill=\"#3b464c\"/><\/svg>',\nspeakers:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"12\" width=\"22\" height=\"42\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"17\" cy=\"24\" r=\"5\" fill=\"#9aa5ab\"/><circle cx=\"17\" cy=\"42\" r=\"8\" fill=\"#6c7a80\"/><rect x=\"36\" y=\"12\" width=\"22\" height=\"42\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"47\" cy=\"24\" r=\"5\" fill=\"#9aa5ab\"/><circle cx=\"47\" cy=\"42\" r=\"8\" fill=\"#6c7a80\"/><\/svg>',\nwebcam:'<svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"24\" r=\"16\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"32\" cy=\"24\" r=\"9\" fill=\"#3b464c\"/><circle cx=\"32\" cy=\"24\" r=\"4\" fill=\"#4fb3e8\"/><circle cx=\"35\" cy=\"21\" r=\"1.5\" fill=\"#fff\"/><path d=\"M22 52 Q32 36 42 52 Z\" fill=\"#9aa5ab\"/><rect x=\"18\" y=\"52\" width=\"28\" height=\"5\" rx=\"2\" fill=\"#6c7a80\"/><\/svg>',\nscanner:'<svg viewBox=\"0 0 64 64\"><path d=\"M8 20 L52 6 L56 12 L12 26 Z\" fill=\"#dfe5e8\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"6\" y=\"30\" width=\"52\" height=\"18\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"10\" y=\"33\" width=\"44\" height=\"5\" fill=\"#bfe8ff\"/><circle cx=\"48\" cy=\"43\" r=\"2\" fill=\"#3fbf6b\"/><\/svg>',\nheadphones:'<svg viewBox=\"0 0 64 64\"><path d=\"M12 38 V30 A20 20 0 0 1 52 30 V38\" stroke=\"#3b464c\" stroke-width=\"5\" fill=\"none\"/><rect x=\"6\" y=\"34\" width=\"14\" height=\"22\" rx=\"6\" fill=\"#d23b3b\"/><rect x=\"44\" y=\"34\" width=\"14\" height=\"22\" rx=\"6\" fill=\"#d23b3b\"/><\/svg>',\ncamera:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"16\" width=\"52\" height=\"36\" rx=\"5\" fill=\"#8fa3ad\"/><rect x=\"12\" y=\"12\" width=\"14\" height=\"6\" rx=\"2\" fill=\"#6c7a80\"/><circle cx=\"38\" cy=\"34\" r=\"13\" fill=\"#3b464c\"/><circle cx=\"38\" cy=\"34\" r=\"8\" fill=\"#4fb3e8\"/><rect x=\"11\" y=\"22\" width=\"9\" height=\"5\" fill=\"#9fe08a\"/><\/svg>',\nfolder:'<svg viewBox=\"0 0 64 64\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg>',\ndoc:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"18\" y=\"26\" width=\"22\" height=\"18\" rx=\"2\" fill=\"#2b5fb9\"/><text x=\"29\" y=\"40\" font-size=\"13\" font-family=\"Arial\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">W<\/text><\/svg>',\ntxt:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><g fill=\"#c3cbcf\"><rect x=\"20\" y=\"24\" width=\"26\" height=\"2\"/><rect x=\"20\" y=\"30\" width=\"26\" height=\"2\"/><rect x=\"20\" y=\"36\" width=\"26\" height=\"2\"/><rect x=\"20\" y=\"42\" width=\"18\" height=\"2\"/><\/g><\/svg>',\nppt:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"18\" y=\"26\" width=\"22\" height=\"18\" rx=\"2\" fill=\"#c8512f\"/><text x=\"29\" y=\"40\" font-size=\"13\" font-family=\"Arial\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">P<\/text><\/svg>',\nimg:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"10\" width=\"52\" height=\"44\" rx=\"3\" fill=\"#e8f6ff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"46\" cy=\"22\" r=\"5\" fill=\"#f2c14e\"/><path d=\"M8 50 L24 30 L36 44 L44 36 L56 50 Z\" fill=\"#3fa36b\"/><\/svg>',\naudio:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><path d=\"M28 44 V24 L42 20 V40\" stroke=\"#8b55d0\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"25\" cy=\"44\" r=\"4\" fill=\"#8b55d0\"/><circle cx=\"39\" cy=\"40\" r=\"4\" fill=\"#8b55d0\"/><\/svg>',\nvideo:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"12\" width=\"52\" height=\"40\" rx=\"4\" fill=\"#3b464c\"/><path d=\"M27 23 L41 32 L27 41 Z\" fill=\"#fff\"/><\/svg>'\n};\nfunction ic(n){return ICON[n]||''}\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction fb(el,ok,msg){el.className='fb '+(ok?'ok':'no');el.textContent=msg}\n\n\n/* desktop hotspots (positions in % of the desktop box, LTR) */\nconst HS=[\n {x:94,y:12,t:'سلة المحذوفات',d:'تذهب إليها الملفات التي نحذفها، ويمكن استعادتها منها.'},\n {x:2.6,y:94,t:'زر بدء',d:'يفتح قائمة البرامج والإعدادات.'},\n {x:9.5,y:94,t:'مستكشف الملفات',d:'نتصفح منه الملفات والمجلدات الموجودة في الحاسب.'},\n {x:13.5,y:94,t:'متصفح مايكروسوفت إيدج',d:'برنامج لتصفح مواقع الإنترنت.'},\n {x:45,y:94,t:'شريط المهام',d:'الشريط السفلي الذي تظهر عليه البرامج المفتوحة وبعض الرموز.'},\n {x:85,y:94,t:'التحكم بمستوى الصوت',d:'نرفع منه صوت الحاسب أو نخفضه.'},\n {x:88.5,y:94,t:'الاتصال بالإنترنت',d:'يبين هل الحاسب متصل بالإنترنت.'},\n {x:95,y:94,t:'التاريخ / الوقت',d:'يعرض الساعة وتاريخ اليوم.'}\n];\nconst desk=document.getElementById('desk'),seenD=new Set();\nHS.forEach((h,i)=>{const b=document.createElement('button');b.className='hs';b.style.left=h.x+'%';b.style.top=h.y+'%';b.setAttribute('aria-label',h.t);\n b.innerHTML=`<span class=\"dot\">${i+1}<\/span>`;\n b.onclick=()=>{seenD.add(i);b.classList.add('seen');document.getElementById('deskInfo').innerHTML=`<b>${h.t}:<\/b> ${h.d}`;\n  document.getElementById('deskCount').textContent=seenD.size===HS.length?'رائع! اكتشفت جميع أجزاء سطح المكتب.':`اكتشفت ${seenD.size} من ${HS.length} أجزاء`};\n desk.appendChild(b)});\ndocument.getElementById('deskCount').textContent=`اكتشفت 0 من ${HS.length} أجزاء`;\n\n/* file types */\nconst FT=[['txt','ملف نصي','.txt'],['doc','ملف مستند','.docx'],['ppt','ملف عرض تقديمي','.pptx'],['img','ملف صورة','.png'],['audio','ملف صوتي','.mp3'],['video','ملف فيديو','.mp4']];\ndocument.getElementById('ftypes').innerHTML=FT.map(f=>`<div class=\"dev\" style=\"cursor:default\">${ic(f[0])}<span class=\"nm\">${f[1]}<\/span><span class=\"en\">${f[2]}<\/span><\/div>`).join('');\n\n/* file name anatomy */\nconst KIND={docx:'مستند وورد',txt:'ملف نصي',pptx:'عرض تقديمي',png:'صورة',jpg:'صورة',mp3:'ملف صوتي',mp4:'فيديو'};\nfunction anat(){const v=document.getElementById('fname').value.trim(),a=document.getElementById('anat'),f=document.getElementById('fnameFb');\n const i=v.lastIndexOf('.');\n if(i<=0||i===v.length-1){a.innerHTML='';fb(f,false,'لا يوجد امتداد. تذكّر: نقطة بين الاسم والامتداد، مثل: رحلتي.png');return}\n const n=v.slice(0,i),e=v.slice(i+1);\n a.innerHTML=`<div style=\"text-align:center\"><span class=\"nmP\">${n.replace(/<\/g,'&lt;')}<\/span><div class=\"en\">الاسم<\/div><\/div><div style=\"text-align:center\"><span class=\"dt\">.<\/span><div class=\"en\">النقطة<\/div><\/div><div style=\"text-align:center\"><span class=\"ex\">${e.replace(/<\/g,'&lt;')}<\/span><div class=\"en\">الامتداد<\/div><\/div>`;\n if(/^(ملف|ملفي|file)\\d*$/i.test(n))fb(f,false,'الاسم عام جداً! اختر اسماً يصف محتوى الملف.');\n else fb(f,true,KIND[e.toLowerCase()]?`نوع الملف: ${KIND[e.toLowerCase()]}`:'اسم مناسب.');}\ndocument.getElementById('fname').addEventListener('input',anat);anat();\n\n/* folder name checker */\ndocument.getElementById('foldCheck').onclick=()=>{const v=document.getElementById('foldName').value,f=document.getElementById('foldFb');\n const bad=[...new Set(v.match(/[\\\\/:*?\"<>|]/g)||[])];\n if(!v.trim())fb(f,false,'اكتب اسماً أولاً.');\n else if(bad.length)fb(f,false,`اسم غير مقبول: يحتوي على الرمز ${bad.join(' ')}`);\n else fb(f,true,'اسم مقبول.')};\n\n/* ordering */\nconst ORD=['اضغط بزر الفأرة الأيمن على سطح المكتب','اضغط «جديد»','اضغط على «مجلد»','اكتب اسم المجلد','اضغط Enter'];\nlet next=0;\nfunction ordInit(){next=0;document.getElementById('orderFb').textContent='';\n document.getElementById('order').innerHTML=shuffle(ORD.map((s,i)=>i)).map(i=>`<button class=\"chip\" data-i=\"${i}\"><span class=\"num\">؟<\/span>${ORD[i]}<\/button>`).join('')}\ndocument.getElementById('order').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||c.classList.contains('done'))return;const f=document.getElementById('orderFb');\n if(+c.dataset.i===next){c.classList.add('done');c.querySelector('.num').textContent=next+1;next++;fb(f,true,next===ORD.length?'أحسنت! هذا هو الترتيب الصحيح.':'صحيح، ما الخطوة التالية؟')}\n else{c.classList.add('wrong');setTimeout(()=>c.classList.remove('wrong'),500);fb(f,false,'ليست هذه الخطوة التالية، فكّر مرة أخرى.')}});\ndocument.getElementById('orderReset').onclick=ordInit;ordInit();\n\n/* copy vs move */\nconst FILE=`<span class=\"file\">${ic('doc')}الدرس 1<\/span>`;\nfunction cReset(){document.querySelector('#fa .items').innerHTML=FILE;document.querySelector('#fb2 .items').innerHTML='';document.getElementById('cfb').textContent=''}\ndocument.getElementById('bCopy').onclick=()=>{cReset();document.querySelector('#fb2 .items').innerHTML=FILE;fb(document.getElementById('cfb'),true,'نسخ: أصبح الملف في المجلدين، وبقي الأصل في مكانه.')};\ndocument.getElementById('bCut').onclick=()=>{cReset();const a=document.querySelector('#fa .items');a.innerHTML=FILE.replace('class=\"file\"','class=\"file ghost\"');\n setTimeout(()=>{a.innerHTML='';document.querySelector('#fb2 .items').innerHTML=FILE},450);fb(document.getElementById('cfb'),true,'نقل: انتقل الملف إلى «علوم» وحُذف من مكانه الأصلي.')};\ndocument.getElementById('bReset').onclick=cReset;cReset();\n\n/* calculator */\nconst K=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','±','='];\nlet cur='0',acc=null,op=null,fresh=false;\nconst scr=document.getElementById('scr');\nfunction show(){scr.textContent=cur}\nfunction calc(a,b,o){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b}\ndocument.getElementById('keys').innerHTML=K.map(k=>`<button class=\"${'÷×−+%'.includes(k)?'op':k==='='?'eq':''}\" data-k=\"${k}\">${k}<\/button>`).join('');\ndocument.getElementById('keys').addEventListener('click',e=>{const k=e.target.dataset.k;if(!k)return;\n if(/[0-9]/.test(k)){cur=(cur==='0'||fresh)?k:cur+k;fresh=false}\n else if(k==='.'){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}\n else if(k==='C'){cur='0';acc=null;op=null}\n else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0'}\n else if(k==='±'){cur=String(-parseFloat(cur))}\n else if(k==='%'){cur=String(parseFloat(cur)/100)}\n else if(k==='='){if(op!=null){const r=calc(acc,parseFloat(cur),op);cur=isNaN(r)?'لا يمكن القسمة على صفر':String(+r.toFixed(10));acc=null;op=null;fresh=true}}\n else{if(op!=null&&!fresh){acc=calc(acc,parseFloat(cur),op);cur=String(+acc.toFixed(10))}else acc=parseFloat(cur);op=k;fresh=true}\n show()});\n\n<\/script>\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>الدرس الثالث: إعدادات جهاز الحاسب<\/title>\n<meta name=\"masar-grades\" content=\"4\">\n<meta name=\"masar-unit\" content=\"الوحدة الأولى: تعلم الأساسيات\">\n<style>\n:root{--teal:#11897f;--teal-d:#0b5f58;--teal-s:#e2f3f0;--ink:#16302d;--mut:#5b706d;--line:#d8e3e0;--bg:#f5faf9;\n--good:#1e8a4c;--good-s:#e1f3e8;--bad:#c43c3c;--bad-s:#fbe4e2;--sun:#f2a516;--sky:#2b8dbf}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Tahoma,\"Segoe UI\",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;font-size:17px}\n.wrap{max-width:920px;margin:0 auto;padding:16px}\n.hero{background:linear-gradient(135deg,#0b5f58,#1a7fa8);color:#fff;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden}\n.hero::after{content:\"\";position:absolute;inset-inline-start:-60px;top:-60px;width:240px;height:240px;border-radius:50%;\n background:repeating-radial-gradient(circle,rgba(255,255,255,.18) 0 3px,transparent 3px 14px)}\n.hero .unit{font-size:14px;opacity:.9}\n.hero h1{margin:4px 0 10px;font-size:30px;line-height:1.3}\n.goals{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;position:relative;z-index:1}\n.goals b{display:block;margin-bottom:2px}\n.goals ul{margin:0;padding-inline-start:20px}\nsection.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}\nh2{font-size:22px;color:var(--teal-d);margin:0 0 8px;display:flex;align-items:center;gap:10px}\nh2 .n{background:var(--teal);color:#fff;border-radius:9px;min-width:32px;height:32px;display:inline-grid;place-items:center;font-size:16px}\nh3{font-size:18px;color:var(--teal-d);margin:14px 0 6px}\np{margin:6px 0}\n.hint{background:#fff7e6;border:1px solid #f6d79a;border-radius:12px;padding:10px 14px;font-size:15.5px}\n.hint b{color:#9a5b00}\n.info{background:var(--teal-s);border-radius:12px;padding:10px 14px;font-size:15.5px}\n.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}\n.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;background:#f8fbfb;border:1px solid var(--line);border-radius:10px;padding:8px 12px}\n.steps li::before{content:counter(s);background:var(--sky);color:#fff;border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;margin-top:3px}\n.en{direction:ltr;unicode-bidi:isolate;font-family:\"Segoe UI\",Arial,sans-serif;color:var(--mut);font-size:.9em}\n.btn{font:inherit;font-size:15px;border:1.5px solid var(--teal);background:#fff;color:var(--teal-d);border-radius:10px;padding:6px 14px;cursor:pointer}\n.btn:hover{background:var(--teal-s)}\n.btn.pri{background:var(--teal);color:#fff}\n.btn.on{background:var(--teal);color:#fff}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}\n.dev{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:10px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:.15s}\n.dev:hover{border-color:var(--teal);transform:translateY(-2px)}\n.dev svg{width:64px;height:64px;display:block;margin:0 auto 4px}\n.dev .nm{font-weight:bold;display:block}\n.dev .more{display:none;font-size:14px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}\n.dev.open .more{display:block}\n.dev.open{border-color:var(--teal);background:#fbfefd}\n.tag{display:inline-block;border-radius:99px;padding:0 10px;font-size:13px;font-weight:bold}\n.tag.main{background:#e4edff;color:#2f5fc4}.tag.ext{background:#fdeee0;color:#b0560c}\n.fb{min-height:1.6em;font-weight:bold;margin-top:6px}\n.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}\n.score{font-weight:bold;color:var(--teal-d)}\n.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}\n.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:120px;cursor:pointer;background:#fbfdfd}\n.bin:hover{border-color:var(--teal)}\n.bin h4{margin:0 0 6px;font-size:16px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px}\n.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:inherit}\n.chip svg{width:26px;height:26px}\n.chip.sel{border-color:var(--teal);background:var(--teal-s)}\n.chip.done{border-color:var(--good);background:var(--good-s);cursor:default}\n.chip.wrong{border-color:var(--bad);background:var(--bad-s)}\n.task{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}\n.task .q{font-weight:bold;margin-bottom:6px}\n.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}\n.flip{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:#fff;font:inherit;color:inherit;min-height:64px}\n.flip.back{background:var(--teal-s);border-color:var(--teal)}\n.hist{background:#fdf0f5;border:1px solid #f1c3d5;border-radius:12px;padding:10px 14px;font-size:15.5px}\n.hist b{color:#a8336a}\n[data-masar]{display:none}\n@media (max-width:560px){.bins{grid-template-columns:1fr}.hero h1{font-size:24px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"unit\">المهارات الرقمية · الصف الرابع الابتدائي · الوحدة الأولى: تعلم الأساسيات<\/div><h1>الدرس الثالث: إعدادات جهاز الحاسب<\/h1>\n<div class=\"goals\"><b>ستتعلم في هذا الدرس:<\/b><ul><li>تغيير التاريخ والوقت والمنطقة الزمنية.<\/li><li>تغيير دقة الشاشة.<\/li><li>تخصيص خلفية سطح المكتب.<\/li><li>ضبط أصوات النظام.<\/li><li>إعدادات الهاتف والجهاز اللوحي.<\/li><\/ul><\/div><\/header>\n\n<style>\n.mock{position:relative;aspect-ratio:16/10;max-width:520px;width:100%;border-radius:10px;overflow:hidden;border:8px solid #2f3e46;background:linear-gradient(160deg,#0a3d7a,#1c6fd1);direction:ltr;transition:background .3s}\n.mock .icons{position:absolute;right:2%;top:3%;display:flex;flex-direction:column;gap:4%;align-items:center;transition:.3s}\n.mock .icons div{background:#f2c14e;border-radius:3px;transition:.3s}\n.mock .bar{position:absolute;left:0;right:0;bottom:0;background:#0e1a2b;display:flex;align-items:center;justify-content:space-between;padding:0 2%;transition:.3s}\n.mock .bar i{background:#7fc3ff;display:inline-block;transition:.3s}\n.mock .clock{color:#fff;font-size:11px;text-align:center;line-height:1.25}\n.res{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}\n.dlg{display:none;margin-top:8px;background:#1b5fb0;color:#fff;border-radius:10px;padding:10px 14px}\n.dlg.show{display:block}\n.dlg .btn{background:#fff}\n.bgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}\n.bgs button{width:80px;height:50px;border-radius:8px;border:3px solid transparent;cursor:pointer}\n.bgs button.on{border-color:var(--sun)}\n.mixer{display:flex;gap:24px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}\n.mixer .ch{display:flex;flex-direction:column;align-items:center;gap:6px;background:#f5f8fa;border:1px solid var(--line);border-radius:12px;padding:10px 14px}\n.mixer input[type=range]{writing-mode:vertical-lr;direction:rtl;height:130px}\n.sel{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;background:#fff}\n.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.cmp>div{border:1px solid var(--line);border-radius:12px;padding:10px 14px}\n@media (max-width:560px){.cmp{grid-template-columns:1fr}}\ntable.sk{width:100%;border-collapse:collapse;font-size:15.5px}\ntable.sk td,table.sk th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start}\n.proj li{margin:4px 0}\n<\/style>\n\n<section class=\"card\">\n<h2><span class=\"n\">1<\/span>التاريخ والوقت<\/h2>\n<p>اضغط على التاريخ والوقت في الجانب السفلي الأيسر من شريط المهام، فتظهر الساعة والتقويم.<\/p>\n<h3>لتغيير التاريخ والوقت في حاسبك<\/h3>\n<ol class=\"steps\">\n <li>اضغط بزر الفأرة الأيمن على التاريخ والوقت في شريط المهام.<\/li>\n <li>اضغط على <b>ضبط التاريخ / الوقت<\/b> <span class=\"en\">(Adjust date/time)<\/span>.<\/li>\n <li>في نافذة <b>الإعدادات<\/b> <span class=\"en\">(Settings)<\/span> اضغط على زر <b>تغيير<\/b> <span class=\"en\">(Change)<\/span>.<\/li>\n <li>حدّد التاريخ والوقت اللذين تريدهما، ثم اضغط <b>تغيير<\/b>.<\/li>\n <li>إذا سافرت، يمكنك اختيار الدولة من قسم <b>المنطقة الزمنية<\/b> <span class=\"en\">(Time Zone)<\/span>.<\/li>\n<\/ol>\n<h3>جرّب: اضبط ساعة الحاسب<\/h3>\n<div class=\"row\">\n <label>الساعة <select class=\"sel\" id=\"hh\"><\/select><\/label>\n <label>الدقيقة <select class=\"sel\" id=\"mm\"><\/select><\/label>\n <label>المنطقة الزمنية <select class=\"sel\" id=\"tz\">\n  <option value=\"3\">الرياض، الكويت (UTC+03:00)<\/option><option value=\"4\">دبي، مسقط (UTC+04:00)<\/option>\n  <option value=\"2\">القاهرة (UTC+02:00)<\/option><option value=\"0\">لندن (UTC+00:00)<\/option><\/select><\/label>\n <button class=\"btn pri\" id=\"setT\">تغيير<\/button>\n<\/div>\n<div style=\"margin-top:10px;display:inline-flex;gap:10px;align-items:center;background:#0e1a2b;color:#fff;border-radius:8px;padding:6px 14px\">\n <span style=\"font-size:12px\">ENG<\/span><span id=\"tbClock\" style=\"text-align:center;line-height:1.3;font-size:14px\"><\/span><\/div>\n<div class=\"fb\" id=\"tFb\"><\/div>\n<div class=\"hist\"><b>لمحة تاريخية:<\/b> تغيّر دول كثيرة الوقت إلى التوقيت الصيفي في الربيع والصيف لتوفير الطاقة. وتعود الفكرة إلى بنجامين فرانكلين عام 1784، واعتُمدت على نطاق واسع في الحرب العالمية الأولى.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">2<\/span>إعدادات الشاشة<\/h2>\n<p>تستخدم أجهزة الحاسب وحدة <b>البكسل<\/b> لإظهار النصوص والصور على الشاشة، ويرمز عدد البكسلات إلى <b>دقة الشاشة<\/b>. الشاشة الأعلى دقة تُظهر النصوص والصور بوضوح أكبر، والأقل دقة تُظهرها بحجم أكبر.<\/p>\n<h3>لتغيير دقة الشاشة<\/h3>\n<ol class=\"steps\">\n <li>اضغط بزر الفأرة الأيمن على مساحة فارغة على سطح المكتب.<\/li>\n <li>اضغط على <b>إعدادات العرض<\/b> <span class=\"en\">(Display settings)<\/span>.<\/li>\n <li>في قسم <b>جهاز العرض<\/b> اضغط على السهم بجوار <b>الدقة<\/b> <span class=\"en\">(Resolution)<\/span> واختر الدقة.<\/li>\n <li>اضغط <b>الاحتفاظ بالتغييرات<\/b> <span class=\"en\">(Keep changes)<\/span> أو <b>إرجاع<\/b> <span class=\"en\">(Revert)<\/span>.<\/li>\n<\/ol>\n<h3>جرّب: غيّر الدقة ولاحظ حجم الأيقونات<\/h3>\n<div class=\"res\" id=\"res\"><\/div>\n<div class=\"mock\" id=\"mock\"><div class=\"icons\" id=\"icons\"><div><\/div><div><\/div><div><\/div><div><\/div><\/div><div class=\"bar\" id=\"bar\"><span><i><\/i> <i><\/i> <i><\/i><\/span><span class=\"clock\" id=\"mClock\"><\/span><\/div><\/div>\n<div class=\"dlg\" id=\"dlg\">هل ترغب في الاحتفاظ بإعدادات العرض هذه؟<div class=\"row\" style=\"margin-top:6px\"><button class=\"btn\" id=\"keep\">الاحتفاظ بالتغييرات<\/button><button class=\"btn\" id=\"revert\">إرجاع<\/button><\/div><\/div>\n<div class=\"fb\" id=\"resFb\"><\/div>\n<div class=\"hint\"><b>انتبه:<\/b> لكل شاشة دقة محددة تناسبها. ومن الخطأ أن تظن أن اختيار أعلى دقة يعني دائماً رسومات أفضل على الشاشة.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">3<\/span>تغيير مظهر سطح المكتب<\/h2>\n<p>لكل حاسب سطح مكتب، ويستطيع كل مستخدم أن يخصّصه بالصور والألوان التي يحبها.<\/p>\n<ol class=\"steps\">\n <li>اضغط بزر الفأرة الأيمن على مساحة فارغة على سطح المكتب.<\/li>\n <li>اضغط على <b>تخصيص<\/b> <span class=\"en\">(Personalize)<\/span>.<\/li>\n <li>من نافذة الإعدادات اضغط على <b>الخلفية<\/b> <span class=\"en\">(Background)<\/span> واختر الصورة التي تعجبك.<\/li>\n<\/ol>\n<p>جرّب: اختر خلفية جديدة لسطح المكتب في الشاشة أعلاه.<\/p>\n<div class=\"bgs\" id=\"bgs\"><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">4<\/span>أصوات النظام<\/h2>\n<p>ابحث عن أيقونة مكبر الصوت في الجانب الأيسر من شريط المهام.<\/p>\n<ol class=\"steps\">\n <li>اضغط بزر الفأرة الأيمن على أيقونة السماعة في شريط المهام.<\/li>\n <li>اضغط على <b>فتح خالط مستوى الصوت<\/b> <span class=\"en\">(Open Volume Mixer)<\/span>.<\/li>\n <li>اسحب شريط التمرير لأعلى أو لأسفل لتغيير مستوى الصوت.<\/li>\n<\/ol>\n<h3>جرّب خالط مستوى الصوت<\/h3>\n<div class=\"mixer\">\n <div class=\"ch\"><b>مكبرات الصوت<\/b><span class=\"en\">Speakers<\/span><input type=\"range\" min=\"0\" max=\"100\" value=\"60\" id=\"v1\" aria-label=\"مستوى مكبرات الصوت\"><span id=\"v1t\"><\/span><\/div>\n <div class=\"ch\"><b>أصوات النظام<\/b><span class=\"en\">System Sounds<\/span><input type=\"range\" min=\"0\" max=\"100\" value=\"40\" id=\"v2\" aria-label=\"مستوى أصوات النظام\"><span id=\"v2t\"><\/span><\/div>\n <button class=\"btn pri\" id=\"beep\">استمع إلى نغمة<\/button>\n<\/div>\n<p class=\"hint\" style=\"margin-top:10px\"><b>فكرة:<\/b> يمكنك أيضاً استخدام عجلة الفأرة لتغيير مستوى الصوت بعد فتح شريط التمرير.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">5<\/span>برامج أخرى: الهاتف والجهاز اللوحي<\/h2>\n<div class=\"cmp\">\n <div><h3>أبل آي أو إس <span class=\"en\">(Apple iOS)<\/span><\/h3><p>كل تطبيق أيقونة على الشاشة، ويمكنك نقل الأيقونة داخل المجلدات. ومن تطبيق <b>الإعدادات<\/b> تضبط: الأصوات، والتاريخ والوقت (من «عام»)، وخلفية الشاشة، وشاشة العرض والإضاءة.<\/p><\/div>\n <div><h3>جوجل أندرويد <span class=\"en\">(Google Android)<\/span><\/h3><p>لإنشاء اختصار: ابحث عن التطبيق، واضغط عليه باستمرار، ثم اسحب رمزه إلى المكان الذي تريده. ولضبط النظام اضغط أيقونة <b>الإعدادات<\/b> <span class=\"en\">(Settings)<\/span>.<\/p><\/div>\n<\/div>\n<div class=\"hint\" style=\"margin-top:10px\"><b>تنبيه:<\/b> كن حذراً عند حذف الملفات في الجهاز اللوحي أو الهاتف، فنظاما أندرويد وآي أو إس <b>لا يحتويان على سلة محذوفات<\/b>. وتتحكم بالصوت فيهما بسهولة من الأزرار على جانب الجهاز.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">6<\/span>مشروع الوحدة<\/h2>\n<p>اعمل مع مجموعتك لتنظيم مجلدات المشروعات وتغيير بعض إعدادات الحاسب:<\/p>\n<ol class=\"proj\">\n <li>أنشئ ثلاثة مجلدات على سطح المكتب وسمّها: «المستندات» و«الصور» و«مقاطع الفيديو».<\/li>\n <li>أنشئ داخل كل منها مجلدات فرعية لكل من المعلمين والطلبة.<\/li>\n <li>افتح برنامج الرسام وارسم مع مجموعتك موضوع «أجزاء الحاسب» ثم احفظه.<\/li>\n <li>استخدم الرسم الذي أنشأته خلفيةً لسطح المكتب.<\/li>\n<\/ol>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">7<\/span>في الختام<\/h2>\n<h3>جدول المهارات: قيّم نفسك<\/h3>\n<table class=\"sk\" id=\"skills\"><\/table>\n<h3>المصطلحات<\/h3>\n<p>اضغط على البطاقة لترى المصطلح بالإنجليزية.<\/p>\n<div class=\"terms\" id=\"terms\"><\/div>\n<\/section>\n\n<\/div>\n\n<ul data-masar=\"match\">\n <li>ضبط التاريخ / الوقت | تغيير ساعة الحاسب وتاريخه<\/li>\n <li>المنطقة الزمنية | نغيّرها عند السفر إلى دولة أخرى<\/li>\n <li>الدقة | عدد البكسلات على الشاشة<\/li>\n <li>تخصيص | تغيير خلفية سطح المكتب<\/li>\n <li>خالط مستوى الصوت | رفع الصوت أو خفضه<\/li>\n<\/ul>\n<ol data-masar=\"training\">\n <li>لتغيير دقة الشاشة نضغط بالزر الأيمن على سطح المكتب ثم نختار: | *إعدادات العرض | تخصيص | ضبط التاريخ / الوقت<\/li>\n <li>بعد اختيار دقة جديدة نريد الإبقاء عليها نضغط: | *الاحتفاظ بالتغييرات | إرجاع | إلغاء الأمر<\/li>\n <li>أيقونة مكبر الصوت توجد في: | *شريط المهام | سلة المحذوفات | الحاسبة<\/li>\n <li>نظاما أندرويد وآي أو إس: | *لا يحتويان على سلة محذوفات | يحتويان على سلة محذوفات | لا يحتويان على إعدادات<\/li>\n<\/ol>\n<ol data-masar=\"quiz\">\n <li>لتغيير التاريخ والوقت نضغط بالزر الأيمن على التاريخ والوقت ثم نختار: | *ضبط التاريخ / الوقت | تخصيص | إعدادات العرض | فتح خالط مستوى الصوت<\/li>\n <li>الوحدة التي تستخدمها الشاشة لإظهار النصوص والصور: | *البكسل | المتر | اللتر | الجرام<\/li>\n <li>الشاشة الأقل دقة تُظهر النصوص والصور: | *بحجم أكبر | بوضوح أكبر | بألوان أكثر | لا تظهرها<\/li>\n <li>لتغيير خلفية سطح المكتب نضغط على: | *تخصيص ثم الخلفية | إعدادات العرض | ضبط التاريخ / الوقت | سلة المحذوفات<\/li>\n <li>لتغيير مستوى الصوت نفتح: | *خالط مستوى الصوت | الحاسبة | مستكشف الملفات | الرسام<\/li>\n <li>إذا سافرت إلى دولة أخرى يمكنك تغيير: | *المنطقة الزمنية | دقة الشاشة | الخلفية | امتداد الملف<\/li>\n<\/ol>\n\n<\script>\nconst ICON={\nmonitor:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"34\" rx=\"3\" fill=\"#2f3e46\"/><rect x=\"10\" y=\"12\" width=\"44\" height=\"26\" fill=\"#4fb3e8\"/><path d=\"M14 32 C24 22 34 34 h=\"2\" fill=\"none\"/><\/svg>',\nprinter:'<svg viewBox=\"0 0 64 64\"><rect x=\"18\" y=\"6\" width=\"28\" height=\"16\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"6\" y=\"20\" width=\"52\" height=\"24\" rx=\"4\" fill=\"#3b464c\"/><rect x=\"12\" y=\"26\" width=\"12\" height=\"7\" fill=\"#9fe08a\"/><circle cx=\"48\" cy=\"30\" r=\"2.5\" fill=\"#ccc\"/><rect x=\"16\" y=\"40\" width=\"32\" height=\"18\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"21\" y=\"45\" width=\"22\" height=\"2\" fill=\"#c3cbcf\"/><rect x=\"21\" y=\"50\" width=\"16\" height=\"2\" fill=\"#c3cbcf\"/><\/svg>',\nmic:'<svg viewBox=\"0 0 64 64\"><rect x=\"36\" y=\"4\" width=\"9\" height=\"20\" rx=\"4.5\" transform=\"rotate(30 40 14)\" fill=\"#6c7a80\"/><path d=\"M36 22 Q28 34 32 46\" stroke=\"#3b464c\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"32\" cy=\"54\" rx=\"16\" ry=\"5\" fill=\"#3b464c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"6\" fill=\"#3b464c\"/><\/svg>',\nspeakers:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"12\" width=\"22\" height=\"42\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"17\" cy=\"24\" r=\"5\" fill=\"#9aa5ab\"/><circle cx=\"17\" cy=\"42\" r=\"8\" fill=\"#6c7a80\"/><rect x=\"36\" y=\"12\" width=\"22\" height=\"42\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"47\" cy=\"24\" r=\"5\" fill=\"#9aa5ab\"/><circle cx=\"47\" cy=\"42\" r=\"8\" fill=\"#6c7a80\"/><\/svg>',\nwebcam:'<svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"24\" r=\"16\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"32\" cy=\"24\" r=\"9\" fill=\"#3b464c\"/><circle cx=\"32\" cy=\"24\" r=\"4\" fill=\"#4fb3e8\"/><circle cx=\"35\" cy=\"21\" r=\"1.5\" fill=\"#fff\"/><path d=\"M22 52 Q32 36 42 52 Z\" fill=\"#9aa5ab\"/><rect x=\"18\" y=\"52\" width=\"28\" height=\"5\" rx=\"2\" fill=\"#6c7a80\"/><\/svg>',\nscanner:'<svg viewBox=\"0 0 64 64\"><path d=\"M8 20 L52 6 L56 12 L12 26 Z\" fill=\"# function parseLessonHTML(text){
  const doc=new DOMParser().parseFromString(text,"text/html");
  const meta=n=>(doc.querySelector(`meta[name="${n}"]`)?.getAttribute("content")||"").trim();
  const title=(meta("masar-title")||doc.querySelector("title")?.textContent||doc.querySelector("h1")?.textContent||"").trim();
  const items=k=>[...doc.querySelectorAll(`[data-masar="${k}"] li`)].map(li=>li.textContent.replace(/\s+/g," ").split("|").map(s=>s.trim()).filter(Boolean));
  const errors=[];
  const match=items("match").filter(x=>{if(x.length!==2){errors.push(`سطر في المطابقة غير مكتمل: «${x.join(" | ")}». الصيغة: المصطلح | المعنى`);return false}return true});
  const qs=(k,label)=>items(k).map((x,i)=>{const [q,...opts]=x;const stars=opts.filter(o=>o.startsWith("*")).length;
    if(opts.length<2||stars!==1){errors.push(`${label}، السؤال ${i+1}: يحتاج خيارين على الأقل وإجابة صحيحة واحدة تبدأ بالعلامة *`);return null}
    const clean=opts.map(o=>o.replace(/^\*\s*/,""));const ci=opts.findIndex(o=>o.startsWith("*"));
    return [q,clean[ci],...clean.filter((_,j)=>j!==ci)]}).filter(Boolean);
  const train=qs("training","التدريب"), quiz=qs("quiz","الاختبار");
  const unit=meta("masar-unit");
  const grades=meta("masar-grades").split(/[,،\s]+/).map(Number).filter(g=>[4,5,6].includes(g));
  doc.querySelectorAll("[data-masar]").forEach(e=>e.remove());
  doc.querySelectorAll('meta[name^="masar-"]').forEach(e=>e.remove());
  const hasContent=(doc.body?.textContent.trim().length||0)>20||!!doc.querySelector("body img,body video,body svg,body canvas");
  return {title,unit,html:"<!doctype html>\n"+doc.documentElement.outerHTML,match,train,quiz,errors,grades,hasContent};
}

/* ---------- progress model ---------- */
const W={content:20,activity:20,training:20,quiz:40}, PASS=70;
const blankRec=()=>({content:false,activity:0,training:0,quiz:null,attempts:0,quizHist:[]});
function pathScore(p){return Math.round((p.content?W.content:0)+p.activity*W.activity/100+p.training*W.training/100+(p.quiz??0)*W.quiz/100)}
const pathDone=p=>p.content&&p.quiz!=null&&p.quiz>=PASS;
const pathsFor=(sid,grade)=>S.paths.filter(p=>p.subj===sid&&p.grades.includes(grade)).sort((a,b)=>a.order-b.order);
const recOf=(email,pid)=>S.prog[email]?.[pid]||blankRec();
function subjStats(st,sid){
  const paths=pathsFor(sid,gradeOf(st.cls)), recs=paths.map(p=>recOf(st.email,p.id));
  const total=paths.length, done=recs.filter(pathDone).length;
  const pct=total?Math.round(recs.reduce((a,r)=>a+pathScore(r),0)/total):0;
  const curIdx=recs.findIndex(r=>!pathDone(r));
  return {paths,recs,total,done,pct,curIdx,cur:curIdx<0?null:paths[curIdx],curRec:curIdx<0?null:recs[curIdx]};
}
function studentStats(st){
  let total=0,done=0,sum=0,active=0,started=false;const per={};
  for(const s of SUBJ){const x=subjStats(st,s.id);per[s.id]=x;total+=x.total;done+=x.done;if(x.total){active++;sum+=x.pct}if(x.recs.some(r=>r.content||r.attempts))started=true}
  const pct=active?Math.round(sum/active):0;
  const status=total&&done===total?"done":!started?"none":pct<50?"bad":"mid";
  const missing=SUBJ.filter(s=>per[s.id].total&&per[s.id].done<per[s.id].total).map(s=>s.id);
  return {total,done,pct,per,status,missing,last:S.prog[st.email]?._last??null};
}

async function cloudLoad(prof){
  const ps=await fs.collection("paths").get();
  const dec=v=>typeof v==="string"?JSON.parse(v):(v||[]);
  S.paths=ps.docs.filter(d=>!d.id.startsWith("_")).map(d=>{const x=d.data();return {id:d.id,...x,match:dec(x.match),train:dec(x.train),quiz:dec(x.quiz),grades:x.grades||[]}});
  if(prof.role==="admin"&&!ps.docs.some(d=>d.id==="_seeded")){
    const add=unitPaths().filter(u=>!S.paths.some(p=>p.id===u.id));
    if(await cloudSavePaths(add)){S.paths.push(...add);await fs.doc("paths/_seeded").set({subj:"",at:Date.now()}).catch(()=>{})}
  }
  S.prog={};
  const asProg=x=>{const o={...(x.recs||{})};if(x.last)o._last=x.last;return o};
  if(prof.role==="student"){
    S.data={source:"cloud",students:[prof],teachers:[]};
    const d=await fs.doc("progress/"+ekey(prof.email)).get();
    if(d.exists)S.prog[prof.email]=asProg(d.data());
  }else{
    const us=(await fs.collection("users").get()).docs.map(d=>({uid:d.id,...d.data()}));
    S.data={source:"cloud",
      students:us.filter(u=>u.role==="student").sort((a,b)=>String(a.name).localeCompare(b.name,"ar")),
      teachers:us.filter(u=>u.role!=="student").map(t=>({...t,id:t.nid,grades:t.grades||[4,5,6]}))};
    (await fs.collection("progress").get()).docs.forEach(d=>{const x=d.data();if(x.email)S.prog[x.email]=asProg(x)});
  }
}

async function doSetup(){
  const name=$("#suName").value.trim(),nid=digits($("#suId").value),pw=$("#suPw").value,pw2=$("#suPw2").value;
  if(!name||nid.length<5){S.loginErr="أدخل الاسم ورقم الهوية.";return render()}
  if(pw.length<6){S.loginErr="كلمة المرور يجب أن تكون ٦ أحرف فأكثر.";return render()}
  if(pw!==pw2){S.loginErr="كلمتا المرور غير متطابقتين.";return render()}
  S.loginErr="";S.settingUp=true;S.view="loading";render();
  try{
    const em=`${nid}@${STAFF_DOMAIN}`;let cr;
    if(auth.currentUser&&auth.currentUser.email===em)cr={user:auth.currentUser};
    else{try{cr=await auth.createUserWithEmailAndPassword(em,pw)}
      catch(e){if(e.code!=="auth/email-already-in-use")throw e;
        try{cr=await auth.signInWithEmailAndPassword(em,pw)}catch(_){throw {code:"setup/wrong-password"}}}}
    const uid=cr.user.uid,b=fs.batch();
    b.set(fs.doc("users/"+uid),{role:"admin",name,nid,spec:"مدير المدرسة",subj:"",grades:[4,5,6]});
    b.set(fs.doc("meta/setup"),{admin:uid,at:Date.now()});
    await b.commit();
    await cloudSavePaths(unitPaths());
    S.settingUp=false;await onUser(auth.currentUser);
    toast("تمت تهيئة المنصة. ابدأ باستيراد الحسابات من Excel");
  }catch(e){S.settingUp=false;S.view="setup";S.loginErr=e.code==="setup/wrong-password"?"رقم الهوية هذا سُجّل في محاولة سابقة بكلمة مرور أخرى. اكتب كلمة المرور التي استخدمتها أول مرة.":"تعذرت التهيئة: "+errTxt(e);render()}
}

async function importAccounts(d){
  S.modal="accounts";S.acc={rows:[],done:0,total:d.students.length+d.teachers.length,running:true};render();
  const sec=firebase.apps.find(x=>x.name==="secondary")||firebase.initializeApp(CFG.firebase,"secondary");
  const sAuth=sec.auth();
  const existing=(await fs.collection("users").get()).docs.map(x=>({uid:x.id,...x.data()}));
  const used=new Set(existing.map(u=>String(u.pin||"")).filter(Boolean));
  const newPin=()=>{for(;;){const a=new Uint32Array(1);crypto.getRandomValues(a);const p=String(1000+a[0]%9000);if(!used.has(p)){used.add(p);return p}}};
  const items=[
    ...d.teachers.map(t=>{const sid=specToSubj(t.spec);t.id=digits(t.id);return {login:t.id,email:`${t.id}@${STAFF_DOMAIN}`,pw:t.id,doc:{role:sid==="admin"?"admin":"teacher",name:t.name,nid:String(t.id),spec:String(t.spec).trim(),subj:sid&&sid!=="admin"?sid:"",grades:t.grades}}}),
    ...d.students.map(s=>({login:ekey(s.email),stu:true,doc:{role:"student",name:s.name,email:ekey(s.email),school:s.school,cls:s.cls,grade:gradeOf(s.cls)}}))];
  for(const it of items){
    const row={name:it.doc.name,role:it.doc.role,cls:it.doc.cls||"",login:it.login,code:"",pin:"",status:"",err:false};
    const ex=existing.find(u=>it.stu?(u.role==="student"&&(it.doc.email?ekey(u.email)===it.doc.email:(u.name===it.doc.name&&u.cls===it.doc.cls))):String(u.nid)===it.doc.nid);
    try{
      if(ex){const upd={...it.doc};if(ex.role==="admin")upd.role="admin";if(it.stu&&!upd.email)upd.email=ex.email;await fs.doc("users/"+ex.uid).set(upd,{merge:true});row.status="حُدّثت بياناته";if(it.stu){if(ex.pin)row.pin=ex.pin;else{const pin=newPin();await movePinAccount(sAuth,{...ex,...upd},pin);row.code=pin;row.status="أُنشئ له رقم دخول"}}}
      else if(it.stu){const pin=newPin();const doc={...it.doc,pin};if(!doc.email)doc.email=`${pin}@${STU_DOMAIN}`;const cr=await sAuth.createUserWithEmailAndPassword(`${pin}@${STU_DOMAIN}`,stuPw(pin));await fs.doc("users/"+cr.user.uid).set(doc);await sAuth.signOut();row.code=pin;row.status="حساب جديد"}
      else{if(it.pw.length<6)throw {code:"bad-id"};const cr=await sAuth.createUserWithEmailAndPassword(it.email,it.pw);await fs.doc("users/"+cr.user.uid).set({...it.doc,idpw:true});await sAuth.signOut();row.code="رقم الهوية";row.status="حساب جديد"}
    }catch(e){row.err=true;row.status=e.code==="bad-id"?"رقم الهوية غير صحيح":e.code==="auth/email-already-in-use"?"له حساب دخول دون ملف بيانات (راجع الدليل)":e.code==="auth/too-many-requests"?"توقف مؤقتاً لكثرة الطلبات، أعد الاستيراد بعد ساعة":"تعذّر: "+errTxt(e)}
    S.acc.rows.push(row);S.acc.done++;if(S.modal==="accounts")render();
  }
  S.acc.running=false;
  try{await cloudLoad(S.meProf)}catch(_){}
  render();
}

function saveXlsx(rows,sheet,file){
  if(typeof XLSX==="undefined"){toast("مكتبة Excel لم تُحمّل. تحقق من الاتصال.");return}
  const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=rows[0].map((_,i)=>({wch:Math.max(10,...rows.map(r=>String(r[i]??"").length+2))}));
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,file);
}
async function cloudResetProgress(){
  const docs=(await fs.collection("progress").get()).docs;
  for(let i=0;i<docs.length;i+=400){const b=fs.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
}

function secAuth(){const sec=firebase.apps.find(x=>x.name==="secondary")||firebase.initializeApp(CFG.firebase,"secondary");return sec.auth()}
async function movePinAccount(sAuth,u,pin){ /* new login account for a student, same profile & progress */
  const cr=await sAuth.createUserWithEmailAndPassword(`${pin}@${STU_DOMAIN}`,stuPw(pin));
  const d={...u,pin};delete d.uid;if(!d.email)d.email=`${pin}@${STU_DOMAIN}`;
  await fs.doc("users/"+cr.user.uid).set(d);await sAuth.signOut();
  if(u.uid&&u.uid!==cr.user.uid)await fs.doc("users/"+u.uid).delete();
  return cr.user.uid;
}
async function fixTeacher(sAuth,t){ /* make sure the teacher can sign in with ID as password */
  const nid=digits(t.nid);if(nid.length<6)return "رقم الهوية غير صحيح";
  for(const dom of [STAFF_DOMAIN,TCH_DOMAIN]){try{await sAuth.signInWithEmailAndPassword(`${nid}@${dom}`,nid);await sAuth.signOut();await fs.doc("users/"+t.uid).set({idpw:true},{merge:true});return "جاهز"}catch(_){}}
  let cr;try{cr=await sAuth.createUserWithEmailAndPassword(`${nid}@${TCH_DOMAIN}`,nid)}catch(e){return "تعذّر: "+errTxt(e)}
  const d={...t,idpw:true};delete d.uid;delete d.id;
  await fs.doc("users/"+cr.user.uid).set(d);await sAuth.signOut();await fs.doc("users/"+t.uid).delete();
  return "جُهّز للدخول برقم الهوية";
}

async function makePins(){
  const sAuth=secAuth();
  const used=new Set(S.data.students.map(s=>String(s.pin||"")).filter(Boolean));
  const newPin=()=>{for(;;){const a=new Uint32Array(1);crypto.getRandomValues(a);const p=String(1000+a[0]%9000);if(!used.has(p)){used.add(p);return p}}};
  const stu=S.data.students.filter(s=>!s.pin),tch=S.data.teachers.filter(t=>t.role==="teacher"&&!t.idpw);
  S.pinRun={running:true,done:0,total:stu.length+tch.length,ok:0,err:0};render();
  for(const s of stu){try{await movePinAccount(sAuth,s,newPin());S.pinRun.ok++}catch(e){S.pinRun.err++;console.warn(e)}S.pinRun.done++;if(S.modal==="pins")render()}
  for(const t of tch){const m=await fixTeacher(sAuth,t);if(/^تعذّر|غير صحيح/.test(m))S.pinRun.err++;else S.pinRun.ok++;S.pinRun.done++;if(S.modal==="pins")render()}
  S.pinRun.running=false;try{await cloudLoad(S.meProf)}catch(_){}render();
}

async function saveStu(){
  const v=id=>($("#"+id)?.value||"").trim();
  const a=S.addStu={name:v("asName").replace(/\s+/g," "),school:v("asSchool"),cls:v("asCls").replace(/\s+/g,""),email:ekey(v("asEmail"))};
  if(!a.name||!a.school||!a.cls){a.err="أدخل اسم الطالب والمدرسة والصف.";return render()}
  if(!gradeOf(a.cls)){a.err="اكتب الصف بصيغة مثل: رابع-1 أو خامس-2 أو سادس-1.";return render()}
  const dup=S.data.students.find(x=>(a.email&&ekey(x.email)===a.email)||(x.name===a.name&&x.cls===a.cls));
  if(dup){a.err=`هذا الطالب موجود مسبقًا${dup.pin?` ورقم دخوله ${dup.pin}`:""}.`;return render()}
  a.err="";a.busy=true;render();
  const used=new Set(S.data.students.map(x=>String(x.pin||"")).filter(Boolean));let pin;
  do{const r=new Uint32Array(1);crypto.getRandomValues(r);pin=String(1000+r[0]%9000)}while(used.has(pin));
  try{
    await movePinAccount(secAuth(),{role:"student",name:a.name,school:a.school,cls:a.cls,grade:gradeOf(a.cls),email:a.email},pin);
    try{await cloudLoad(S.meProf)}catch(_){}
    S.addStu={done:{name:a.name,cls:a.cls,school:a.school,pin}};
  }catch(e){a.busy=false;a.err=e.code==="auth/email-already-in-use"?"حدث تعارض في رقم الدخول، اضغط مرة أخرى.":"تعذّرت الإضافة: "+errTxt(e)}
  render();
}

const GUEST_BLOCK=new Set(["accounts","pins","addStu","addStuAgain","import","upload","upAgain","publish","askDel","del","mv","resetProg","saveStu","makePins","dlPins","dlCodes"]);
function guestProgress(){
  const prog={},now=Date.now();
  S.data.students.forEach((st,si)=>{
    const g=gradeOf(st.cls),r=rng(hash(st.email)),o={};let any=false;
    S.paths.filter(p=>p.grades.includes(g)).forEach(p=>{
      const lv=r();if(lv<.18)return;any=true;
      const rec=blankRec();rec.content=true;rec.activity=Math.round(50+r()*50);
      if(lv>.35){rec.training=Math.round(40+r()*60)}
      if(lv>.5){rec.quiz=Math.round(40+r()*60);rec.attempts=1+Math.floor(r()*2);rec.quizHist=[rec.quiz]}
      o[p.id]=rec});
    if(any){o._last=now-Math.floor(r()*6)*864e5;prog[st.email]=o}
  });
  return prog;
}

function allRows(){return S.data.students.map(st=>({st,...studentStats(st)}))}
function sortRows(rows,key,dir){
  const k={name:r=>r.st.name,school:r=>r.st.school,cls:r=>r.st.cls,done:r=>r.done,total:r=>r.total,pct:r=>r.pct,last:r=>r.last??0,spct:r=>r.spct}[key];
  return rows.sort((a,b)=>{const x=k(a),y=k(b);return (typeof x==="string"?x.localeCompare(y,"ar"):x-y)*dir});
}
function barHTML(p){return `<div class="bar"><div class="t"><i class="lv-${lvl(p)}" style="width:${p}%"></i></div><b>${p}٪</b></div>`}
function th(label,key,state,act){const on=state.sort===key;return `<th class="sort" data-act="${act}" data-k="${key}" aria-sort="${on?(state.dir>0?"ascending":"descending"):"none"}">${label}${on?`<span class="ar">${state.dir>0?"▲":"▼"}</span>`:""}</th>`}
function lastTxt(t){if(!t)return "—";const d=Math.floor((Date.now()-t)/864e5);return d<=0?"اليوم":d===1?"أمس":`قبل ${d} أيام`}
const avgOf=(arr)=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;

  </div>
  <div class="grid2">
   <section class="panel">
    <div class="panel-h"><h3>تقدّم الطلاب في ${s.name}</h3><span class="muted small">م = مسار · الرقم = درجة الاختبار</span></div>

function stageTxt(p){if(!p)return "";if(!p.content)return "لم يبدأ";if(!p.activity)return "بعد المحتوى";if(!p.training)return "بعد النشاط";if(p.quiz==null)return "قبل الاختبار";return `رسب في الاختبار (${p.quiz}٪)`}

/* ---------- upload / preview modals ---------- */
function pathParts(p,showErr){
  const ok=(c,l)=>`<li class="${c?"ok":"no"}"><span>${c?"✓":"✕"}</span>${l}</li>`;
  return `<ul class="check">
   ${ok(p.hasContent!==false,"الشرح (محتوى الصفحة)")}
   ${ok(p.match.length>=2,`النشاط: ${p.match.length} أزواج مطابقة <span class="muted">(٢ على الأقل)</span>`)}
   ${ok(p.train.length>=1,`التدريب: ${p.train.length} أسئلة <span class="muted">(١ على الأقل)</span>`)}
   ${ok(p.quiz.length>=3,`الاختبار القصير: ${p.quiz.length} أسئلة <span class="muted">(٣ على الأقل)</span>`)}
  </ul>${showErr&&p.errors?.length?`<div class="errs">${p.errors.map(e=>`<div>${esc(e)}</div>`).join("")}</div>`:""}`;
}
function qList(p){
  const ql=(arr,lbl)=>arr.length?`<h4>${lbl}</h4><ol class="ql">${arr.map(q=>`<li dir="auto">${esc(q[0])}<div class="small"><span style="color:var(--good)">✓ ${esc(q[1])}</span>${q.slice(2).map(o=>` · <span class="muted">${esc(o)}</span>`).join("")}</div></li>`).join("")}</ol>`:"";
  return `${p.match.length?`<h4>المطابقة</h4><ol class="ql">${p.match.map(m=>`<li dir="auto">${esc(m[0])} ← ${esc(m[1])}</li>`).join("")}</ol>`:""}${ql(p.train,"التدريب")}${ql(p.quiz,"الاختبار القصير")}`;
}

async function handleLessonFile(f){
  if(!f)return;
  if(!/\.html?$/i.test(f.name)){toast("اختر ملفاً بامتداد html");return}
  try{const text=await f.text();const p=parseLessonHTML(text);
    const g=p.grades.filter(x=>S.user.grades.includes(x));
    S.up={...p,file:f.name,grades:g.length?g:S.user.grades.slice(),pos:teacherPaths().length};render();
  }catch(e){toast("تعذرت قراءة الملف")}
}
async function publishUpload(){
  const u=S.up, tp=teacherPaths();
  const p={id:"p"+Date.now().toString(36),subj:S.user.subj,title:u.title.trim(),unit:u.unit||"",grades:u.grades.slice().sort(),order:0,html:u.html,match:u.match,train:u.train,quiz:u.quiz,by:S.user.name,at:Date.now(),sample:false};
  const list=tp.slice();list.splice(u.pos,0,p);list.forEach((x,i)=>x.order=i+1);
  if(CLOUD){const bt=document.querySelector('[data-act="publish"]');if(bt){bt.disabled=true;bt.textContent="جارٍ النشر…"}const okk=await cloudSavePaths(list);if(!okk){list.forEach((x,i)=>x.order=i+1);if(bt){bt.disabled=false;bt.textContent="نشر المسار للطلاب"}return}}S.paths.push(p);S.up=null;S.modal=null;save();render();toast(`نُشر المسار «${p.title}» لطلاب ${p.grades.map(g=>gradeName[g]).join(" و")}`);
}

function commitPath(){

/* ---------- rings canvas (echoes the school mark) ---------- */
function drawRings(cv){
  if(!cv)return;const d=window.devicePixelRatio||1, w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;
  const x=cv.getContext("2d");x.scale(d,d);const cx=w*.62, cy=h*.36;
  for(let i=1;i<28;i++){x.beginPath();x.arc(cx,cy,i*18,0,Math.PI*2);x.strokeStyle=`rgba(160,240,228,${Math.max(.04,.42-i*.014)})`;x.lineWidth=5;x.stroke()}
}

  const find=re=>wb.SheetNames.find(n=>re.test(n));
  const sn=find(/طلاب/), tn=find(/معلم/);
  if(!sn||!tn)throw new Error("لم نجد ورقتي «الطلاب» و«المعلمين» في الملف.");
  const sr=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""}), tr=XLSX.utils.sheet_to_json(wb.Sheets[tn],{defval:""});
  const key=(row,re)=>{const k=Object.keys(row).find(k=>re.test(k.trim()));return k?String(row[k]).trim():""};
  const students=sr.map(r=>({name:key(r,/اسم الطالب/),school:key(r,/المدرسة/),cls:key(r,/الفصل|الصف/),email:key(r,/حساب|بريد|ايميل/)})).filter(s=>s.name&&s.email);
  const teachers=tr.map(r=>{const g=[];if(+key(r,/الرابع/))g.push(4);if(+key(r,/الخامس/))g.push(5);if(+key(r,/السادس/))g.push(6);
    return {name:key(r,/^المعلم/),spec:key(r,/التخصص/),id:key(r,/هوية/).replace(/\D/g,""),grades:g.length?g:[4,5,6]}}).filter(t=>t.name&&t.id);
  if(!students.length)throw new Error("ورقة الطلاب فارغة أو أعمدتها مختلفة.");
  return {source:"file",students,teachers};
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="closeDrawer"||el.dataset.act==="closeModal"){if(e.target.closest("[data-stop]")&&!e.target.closest(".close,.btn.ghost"))return}
  const a=el.dataset.act,k=el.dataset.k;
  if(a==="gEnter"){enterGuest();return}
  if(a==="gExit"){exitGuest();return}
  if(a==="gTour"){guestTour(k,el.dataset.g);return}
  if(S.guest&&GUEST_BLOCK.has(a)){toast("هذه الخدمة متاحة للمعلم والإدارة بعد تسجيل الدخول");return}
  if(a!=="resetProg")S.confirmReset=false;
  switch(a){
   case "demo":
    S.drawer=null;S.modal=null;S.up=null;clearInterval(readTimer);
    if(k==="login"){S.user=null;S.view="login";render()}
    else if(k==="admin")loginStaff(S.data.teachers.find(t=>specToSubj(t.spec)==="admin")||{name:"مدير المدرسة",spec:"مدير المدرسة",grades:[4,5,6]});
    else if(k==="teacher"){const t=S.data.teachers.find(t=>specToSubj(t.spec)==="digital")||S.data.teachers.find(t=>{const s=specToSubj(t.spec);return s&&s!=="admin"});loginStaff(t)}
    else if(k==="student")loginStudent(S.data.students[0]);
    break;
   case "import":$("#xlsFile").click();break;
   case "resetDemo":loadData(demoData());S.user=null;S.view="login";render();toast("تمت العودة للبيانات الافتراضية");break;
   case "resetProg":if(!S.confirmReset){S.confirmReset=true;render()}else{S.confirmReset=false;S.prog={};save();if(CLOUD)cloudResetProgress().catch(e=>toast("تعذر التصفير: "+errTxt(e)));if(S.view==="path")S.view="student";render();toast("تم تصفير إنجازات جميع الطلاب")}break;
   case "tab":S.loginTab=k;S.loginErr="";render();break;
   case "fill":$("#lgIn").value=el.dataset.v;break;
   case "msLogin":{const v=$("#lgIn").value;if(v)doLogin(v);else{S.loginErr="في نسخة البناء يُحوَّل الطالب إلى صفحة دخول Microsoft الرسمية. للتجربة الآن أدخل البريد الوزاري.";render()}break}
   case "logout":if(S.guest){exitGuest();break}clearInterval(readTimer);S.drawer=null;S.modal=null;if(CLOUD){auth.signOut()}else{S.user=null;S.view="login";render()}break;
   case "backMe":clearInterval(readTimer);S.drawer=null;S.modal=null;loginStaff({...S.meProf,id:S.meProf.nid,grades:S.meProf.grades||[4,5,6]});break;
   case "accounts":S.modal="accounts";S.acc=null;render();break;
   case "pickAccounts":$("#xlsFile").click();break;
   case "dlCodes":downloadCodes();break;
   case "pins":S.modal="pins";S.pinRun=null;render();break;
   case "makePins":makePins();break;
   case "dlPins":dlPins();break;
   case "addStu":case "addStuAgain":S.modal="addStu";S.addStu=null;render();setTimeout(()=>$("#asName")&&$("#asName").focus(),50);break;
   case "saveStu":saveStu();break;
   case "exportXlsx":saveXlsx(reportRows(),"التقرير الأسبوعي","تقرير-مسارات-المركزية-"+new Date().toISOString().slice(0,10)+".xlsx");break;
   case "printPdf":window.print();break;
   case "fsort":S.f.dir=S.f.sort===k?-S.f.dir:1;S.f.sort=k;render();break;
   case "tsort":S.tf.dir=S.tf.sort===k?-S.tf.dir:1;S.tf.sort=k;render();break;
   case "fstatus":S.f.status=k;render();break;
   case "open":S.drawer=k;render();break;
   case "closeDrawer":S.drawer=null;render();break;
   case "asTeacher":loginStaff(S.data.teachers.find(t=>t.id===k));break;
   case "asStudent":S.drawer=null;loginStudent(S.data.students.find(s=>s.email===k));break;
   case "report":S.modal="report";render();break;
   case "closeModal":if((S.acc&&S.acc.running)||(S.pinRun&&S.pinRun.running)||(S.addStu&&S.addStu.busy))break;S.modal=null;S.up=null;render();break;
   case "copyTSV":copyText(reportTSV(),"نُسخ الجدول. الصقه في Excel مباشرة");break;
   case "copyTpl":copyText(TEMPLATE,"نُسخ القالب. الصقه في ملف جديد واحفظه بامتداد html");break;
   case "exportNote":toast("التصدير إلى ملف يُفعَّل في نسخة البناء");break;
   case "upload":S.modal="upload";S.up=null;render();break;
   case "upAgain":S.up=null;render();$("#htmlFile").click();break;
   case "upGrade":{const g=+k,u=S.up;u.grades=el.checked?[...new Set([...u.grades,g])]:u.grades.filter(x=>x!==g);render();break}
   case "publish":if(upValid(S.up))publishUpload();break;
   case "preview":S.previewId=k;S.modal="preview";render();break;
   case "askDel":S.confirmDel=k;render();break;
   case "cancelDel":S.confirmDel=null;render();break;
   case "del":{const p=S.paths.find(x=>x.id===k);S.paths=S.paths.filter(x=>x.id!==k);S.confirmDel=null;teacherPaths().forEach((x,i)=>x.order=i+1);save();cloudDeletePath(k);cloudSavePaths(teacherPaths());render();toast(`حُذف المسار «${p?.title||""}»`);break}
   case "mv":{const tp=teacherPaths(),i=tp.findIndex(x=>x.id===k),j=i+(+el.dataset.d);if(j<0||j>=tp.length)break;[tp[i],tp[j]]=[tp[j],tp[i]];tp.forEach((x,n)=>x.order=n+1);save();cloudSavePaths(tp);render();break}
   case "home":clearInterval(readTimer);S.view="student";render();break;
   case "openSubj":clearInterval(readTimer);S.subj=el.dataset.s;S.view="subject";render();window.scrollTo(0,0);break;
   case "openPath":clearInterval(readTimer);openPath(el.dataset.s,+el.dataset.i);break;
   case "step":{const n=+k;if(stepUnlocked(n)){clearInterval(readTimer);S.play.step=n;render();window.scrollTo(0,0)}break}
   case "big":S.play.big=!S.play.big;render();break;
   case "readDone":S.play.contentDone=true;markProgress(P=>P.content=true);S.play.step=1;render();window.scrollTo(0,0);break;
   case "mL":S.play.match.sel=+k;S.play.match.wrong=null;render();break;
   case "mR":{const m=S.play.match;if(m.sel==null){toast("اختر أولاً من العمود الأول");break}
     if(+k===m.sel){m.ok.push(m.sel);m.sel=null;m.wrong=null;if(m.ok.length===curPath().match.length){S.play.score.activity=Math.max(40,100-m.err*15);markProgress(P=>P.activity=Math.max(P.activity,S.play.score.activity))}}
     else{m.err++;m.wrong=+k}render();break}
   case "tr":{const q=S.play.train[+el.dataset.q];q.pick=el.dataset.v;const t=S.play.train;if(t.every(x=>x.pick!=null)){S.play.score.training=Math.round(t.filter(x=>x.pick===x.ans).length/t.length*100);markProgress(P=>P.training=Math.max(P.training,S.play.score.training))}render();break}
   case "qz":S.play.quiz[+el.dataset.q].pick=el.dataset.v;render();break;
   case "submitQuiz":{const q=S.play.quiz;S.play.score.quiz=Math.round(q.filter(x=>x.pick===x.ans).length/q.length*100);S.play.quizDone=true;commitPath();S.play.step=4;render();window.scrollTo(0,0);break}
   case "retryQuiz":{const p=S.play,r=rng(Date.now());p.quiz=p.quiz.map(q=>({...q,opts:shuffle(q.opts,r),pick:null}));p.quizDone=false;p.step=0;render();window.scrollTo(0,0);break}
  }
});
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>toast("تعذر النسخ في هذا المتصفح، حدّد النص وانسخه يدوياً"))}catch(_){toast("تعذر النسخ في هذا المتصفح")}}
document.addEventListener("submit",e=>{if(e.target.id==="loginForm"){e.preventDefault();doLogin($("#lgIn").value)}if(e.target.id==="setupForm"){e.preventDefault();doSetup()}});
document.addEventListener("input",e=>{
  const live=e.target.dataset.live;if(live&&S.up){S.up[live]=live==="pos"?+e.target.value:e.target.value;
    const btn=document.querySelector('[data-act="publish"]');if(btn)btn.disabled=!upValid(S.up);return}
  const p=e.target.dataset.in;if(!p)return;const [o,f]=p.split(".");S[o][f]=e.target.value;
  const id=e.target.id,pos=e.target.selectionStart;render();const n=document.getElementById(id);if(n&&n.type==="search"){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.drawer||S.modal)){S.drawer=null;S.modal=null;S.up=null;render()}});
document.addEventListener("dragover",e=>{const dz=e.target.closest?.("#dz");if(dz){e.preventDefault();dz.classList.add("over")}});
document.addEventListener("dragleave",e=>{const dz=e.target.closest?.("#dz");if(dz)dz.classList.remove("over")});
document.addEventListener("drop",e=>{const dz=e.target.closest?.("#dz");if(dz){e.preventDefault();handleLessonFile(e.dataTransfer.files[0])}});
$("#htmlFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";handleLessonFile(f)});
$("#xlsFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{if(typeof XLSX==="undefined")throw new Error("مكتبة قراءة Excel لم تُحمّل. تحقق من الاتصال.");
    const d=parseWorkbook(await f.arrayBuffer());
    if(CLOUD){await importAccounts(d);return}
    loadData(d);S.user=null;S.view="login";S.drawer=null;S.modal=null;render();
    toast(`تم استيراد ${d.students.length} طالباً و${d.teachers.length} معلماً. البيانات تبقى على جهازك`);
  }catch(err){toast(err.message||"تعذرت قراءة الملف")}
});
if(!CLOUD)render();else render();
</script>
