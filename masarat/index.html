<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icon.png">
<title>مسارات المركزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* Layout: a calm admin shell — top identity bar, KPI strip, then the work surface. Concentric progress rings echo the school mark. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface-2:#f6f9f8; --ink:#16302d; --muted:#5b706d; --line:#d8e3e0;
  --teal:#11897f; --teal-ink:#0b5f58; --teal-soft:#dff1ee; --on-teal:#ffffff;
  --good:#1e8a4c; --good-soft:#e1f3e8; --warn:#b8740a; --warn-soft:#fbefd9; --bad:#c43c3c; --bad-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(16,48,44,.06),0 4px 14px rgba(16,48,44,.05);
  --c-math:#3a6fd6; --c-science:#3f9b3f; --c-arabic:#c06a1b; --c-english:#8b55d0; --c-islamic:#12857c; --c-social:#c9476f; --c-digital:#2b8dbf;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152220; --surface-2:#1a2a28; --ink:#e3eeec; --muted:#93a8a4; --line:#27403c;
  --teal:#38bfb1; --teal-ink:#7fdcd2; --teal-soft:#16393a; --on-teal:#06231f;
  --good:#4cc47e; --good-soft:#163323; --warn:#e5a83b; --warn-soft:#3a2c12; --bad:#ec7171; --bad-soft:#3d1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-math:#6f97ea; --c-science:#6cc06c; --c-arabic:#e09450; --c-english:#ad86e6; --c-islamic:#3fbcb0; --c-social:#e2779a; --c-digital:#5bb4e0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152220; --surface-2:#1a2a28; --ink:#e3eeec; --muted:#93a8a4; --line:#27403c;
  --teal:#38bfb1; --teal-ink:#7fdcd2; --teal-soft:#16393a; --on-teal:#06231f;
  --good:#4cc47e; --good-soft:#163323; --warn:#e5a83b; --warn-soft:#3a2c12; --bad:#ec7171; --bad-soft:#3d1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-math:#6f97ea; --c-science:#6cc06c; --c-arabic:#e09450; --c-english:#ad86e6; --c-islamic:#3fbcb0; --c-social:#e2779a; --c-digital:#5bb4e0;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* demo strip */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:7px}
.demo b{font-weight:600}
.demo .sp{flex:1}
.demo button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:999px;padding:2px 12px;font-size:12.5px}
.demo button.on{background:var(--bg);color:var(--ink)}
.demo .src{opacity:.8}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo-tile{width:52px;height:52px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-tile img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:19px;color:var(--teal-ink)}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.moe{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;padding:4px 10px;line-height:1.25;font-size:11.5px;color:var(--muted);text-align:center;height:52px}
.moe b{font-family:var(--f-display);font-size:13px;color:var(--ink)}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.who .n{font-weight:600;font-size:14px;line-height:1.2}
.who .r{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 10px;font-size:13px}

main{padding-block:22px 48px}
.page-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-h h2{font-size:24px}
.page-h p{margin:2px 0 0;color:var(--muted)}
.eyebrow{font-size:12.5px;color:var(--teal-ink);font-weight:600;letter-spacing:.02em}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)} .kpi.acc .v{color:var(--teal-ink)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:first-child{grid-column:1/-1}}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px}
.panel-b{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px;min-width:0}
.filters input{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13.5px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th .ar{font-size:10px;margin-inline-start:4px;color:var(--teal)}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
td.name{font-weight:600}
td .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;min-width:150px}
.bar .t{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px}
.bar b{font-variant-numeric:tabular-nums;min-width:40px;text-align:end;font-weight:600}
.lv-bad{background:var(--bad)} .lv-warn{background:var(--warn)} .lv-good{background:var(--good)} .lv-teal{background:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:12.5px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-good{background:var(--good-soft);color:var(--good)} .p-mute{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
td .chips{flex-wrap:nowrap}
.chip{font-size:11.5px;border-radius:6px;padding:0 7px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip .d{display:inline-block;width:7px;height:7px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* subject bars panel */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar .top-l{display:flex;justify-content:space-between;font-size:13.5px}
.hbar .t{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.hbar .t i{display:block;height:100%}
.dist{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;background:var(--c)}
.mini-list{display:flex;flex-direction:column}
.mini-list button{display:flex;justify-content:space-between;gap:10px;border:0;background:transparent;padding:8px 0;border-bottom:1px solid var(--line);text-align:start}
.mini-list button:last-child{border-bottom:0}
.mini-list button:hover .nm{color:var(--teal-ink)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,18,.45);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.drawer h3{font-size:20px}
.close{float:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.subj-rows{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.subj-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.subj-row .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.modal-scrim{position:fixed;inset:0;background:rgba(8,20,18,.45);z-index:60;overflow:auto;padding:24px 16px}
.sheet{background:var(--surface);max-width:860px;margin:0 auto;border-radius:14px;padding:26px;border:1px solid var(--line)}
.sheet-h{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--teal);padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap}
.sheet-h .sp{flex:1}
.sheet h4{font-family:var(--f-display);font-size:15px;margin:18px 0 8px}
.sheet table th{position:static}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
.note{font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px}

/* login */
.login{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1.05fr 1fr}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .art{display:none}}
.login .art{background:var(--teal-ink);color:#fff;position:relative;overflow:hidden;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.login .art canvas{position:absolute;inset:0;width:100%;height:100%}
.login .art > *:not(canvas){position:relative}
.login .art h2{font-size:38px;line-height:1.25}
.login .art p{max-width:46ch;opacity:.9;margin:0}
.login .art .steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.login .art .steps span{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:2px 12px;font-size:13px}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login .card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.login .ids{display:flex;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13.5px;font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;font-size:15px}
.field input:focus{border-color:var(--teal);outline:none}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:0}
.ms{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;font-weight:600}
.ms svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-acc{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.demo-acc .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.demo-acc button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:2px 9px;font-size:12.5px}

/* student */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:20px}
@media (max-width:700px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.rings{width:220px;max-width:100%}
.rings text{fill:var(--ink)}
.hero h2{font-size:26px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px;margin-top:6px}
.hero .cont{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:700px){.hero .meta,.hero .cont{justify-content:center}}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:start;transition:border-color .15s,transform .15s}
.sc:hover{border-color:var(--sc);transform:translateY(-1px)}
.sc .hd{display:flex;align-items:center;gap:10px}
.sc .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;background:var(--sc);font-size:16px}
.sc h3{font-size:17px}
.sc .pct{margin-inline-start:auto;font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sc .t{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.sc .t i{display:block;height:100%;background:var(--sc)}
.sc .ft{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.sc .next{font-size:13.5px}

/* subject page */
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--teal-ink);padding:0;font-weight:500}
.subj-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:18px}
.subj-head .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:22px;font-weight:700;background:var(--sc)}
.subj-head .sp{flex:1;min-width:180px}
.subj-head h2{font-size:24px}
.big{font-family:var(--f-display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--sc)}
.formula{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.formula span{border:1px solid var(--line);border-radius:7px;padding:1px 8px;background:var(--surface-2)}
.track{display:flex;flex-direction:column;gap:0;position:relative}
.pth{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;position:relative}
.pth .node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.pth.done .node{background:var(--good);border-color:var(--good);color:#fff}
.pth.cur .node{border-color:var(--sc);color:var(--sc);box-shadow:0 0 0 5px color-mix(in srgb,var(--sc) 18%,transparent)}
.pth.lock .node{color:var(--muted)}
.track .pth:not(:last-child)::after{content:"";position:absolute;inset-inline-start:23px;top:58px;bottom:-14px;width:2px;background:var(--line)}
.track .pth.done:not(:last-child)::after{background:var(--good)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.pth.lock .pcard{opacity:.65}
.pcard .tt{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.pcard .tt b{font-family:var(--f-display);font-size:15.5px;font-weight:600}
.steps4{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.steps4 span{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.steps4 span.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.steps4 span.half{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pth .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:96px}
@media (max-width:600px){.pth{grid-template-columns:40px minmax(0,1fr)}.pth .act{grid-column:2;align-items:flex-start;flex-direction:row;align-items:center}.pth .node{width:38px;height:38px}.track .pth:not(:last-child)::after{inset-inline-start:19px}}

/* player */
.player{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.player{grid-template-columns:1fr}}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:90px}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto}}
.st{display:flex;gap:10px;align-items:center;border:0;background:transparent;border-radius:10px;padding:8px 10px;text-align:start;flex:none}
.st .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:13px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.st .w{font-size:12px;color:var(--muted);display:block;line-height:1.2}
.st.on{background:var(--teal-soft)}
.st.on .c{border-color:var(--teal);color:var(--teal-ink)}
.st.ok .c{background:var(--good);border-color:var(--good);color:#fff}
.st[disabled]{opacity:.5;cursor:not-allowed}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.stage h3{font-size:20px;margin-bottom:4px}
.stage .lead{color:var(--muted);margin:0 0 16px}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:linear-gradient(135deg,var(--teal-ink),#0a3b37);position:relative;overflow:hidden;color:#fff;display:grid;place-items:center}
.video canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.video .pl{position:relative;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.95);border:0;display:grid;place-items:center}
.video .pl svg{width:28px;height:28px;fill:#0b5f58;margin-left:4px}
.video .cap{position:absolute;top:14px;inset-inline-start:16px;font-family:var(--f-display);font-size:17px;font-weight:600}
.video .cap small{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;opacity:.8}
.video .pb{position:absolute;bottom:0;inset-inline:0;height:6px;background:rgba(255,255,255,.2)}
.video .pb i{display:block;height:100%;background:#fff;width:0}
.video .tm{position:absolute;bottom:12px;inset-inline-end:14px;font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.9}
.explain{margin-top:16px;display:grid;gap:10px}
.explain p{margin:0;max-width:68ch}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kp div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.kp div b{display:block;font-family:var(--f-display);color:var(--teal-ink);font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:start;font-weight:500;transition:all .12s}
.mt:hover{border-color:var(--teal)}
.mt.sel{border-color:var(--teal);background:var(--teal-soft)}
.mt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.mt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:10px;display:flex;gap:8px}
.q .qt .n{color:var(--teal-ink);font-family:var(--f-display)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;text-align:start}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{font-size:13.5px;margin-top:8px}
.ltr{direction:ltr;unicode-bidi:isolate}
.result{text-align:center;padding:10px 0}
.result .score{font-family:var(--f-display);font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bd{max-width:460px;margin:16px auto 0;text-align:start}
.bd table td{white-space:normal}
.bd tfoot td{font-weight:700;border-bottom:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;z-index:90;font-size:14px;max-width:calc(100% - 32px)}
.sample-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:14px}

.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.mng{display:flex;flex-direction:column;gap:10px}
.mi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mi-h{display:flex;gap:10px;align-items:flex-start}
.mi-h b{font-family:var(--f-display);font-weight:600;display:block}
.ord{width:28px;height:28px;border-radius:8px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-weight:700;flex:none}
.mi-a{display:flex;gap:6px;flex-wrap:wrap}
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--teal);border-radius:14px;padding:34px 16px;background:var(--teal-soft);cursor:pointer;text-align:center;transition:background .15s}
.dz:hover,.dz.over{background:color-mix(in srgb,var(--teal) 22%,var(--surface))}
.dz b{font-family:var(--f-display);font-size:17px;color:var(--teal-ink)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.howto div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.howto b{font-family:var(--f-display);color:var(--teal-ink)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;direction:ltr;unicode-bidi:isolate}
.tpl-h{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.tpl{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.55;overflow:auto;max-height:320px;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;margin:0}
.up-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.up-grid{grid-template-columns:1fr}}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px}
.gchk{display:flex;gap:14px;flex-wrap:wrap}
.gchk label{display:flex;gap:6px;align-items:center;font-weight:500}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.check li{display:flex;gap:8px;align-items:center}
.check li span:first-child{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.check li.ok span:first-child{background:var(--good-soft);color:var(--good)}
.check li.no span:first-child{background:var(--bad-soft);color:var(--bad)}
.errs{margin-top:8px;font-size:13px;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.frame{width:100%;height:440px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
.frame.big{height:78vh}
.qd{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.qd summary{cursor:pointer;font-weight:600;color:var(--teal-ink)}
.ql{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stage-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sc[disabled]{opacity:.6;cursor:not-allowed;transform:none}
.sc[disabled]:hover{border-color:var(--line)}
.unit-h{font-family:var(--f-display);font-weight:600;color:var(--sc);margin:14px 0 2px;padding-inline-start:4px;border-inline-start:4px solid var(--sc);padding:2px 10px}
[hidden]{display:none!important}
img{max-width:100%}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr)!important}.login .art{padding:28px 20px!important}.login .art h2{font-size:30px!important}.login .form{min-width:0}}
html,body{overflow-x:hidden}
.ids{display:flex;align-items:center;gap:12px}
.center-card{min-height:70vh;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:32px 16px}
.pcards{display:none}.pcard{border:2px dashed #0f6b63;border-radius:14px;padding:12px;text-align:center;break-inside:avoid}.pc-t{color:#0f6b63;font-weight:bold;font-size:14px}.pc-n{font-size:18px;font-weight:bold;margin-top:4px}.pc-c{font-size:13px;color:#555}.pc-p{font-size:40px;font-weight:bold;letter-spacing:10px;margin:6px 0;direction:ltr}.pc-u{font-size:11px;color:#555;direction:ltr}
@media print{.ptable{display:none!important}.pcards{display:grid!important;grid-template-columns:1fr 1fr 1fr;gap:10px}.demo,.top,main,.toast{display:none!important}.modal-scrim{position:static;background:none;padding:0;overflow:visible}.sheet{border:0;max-width:none;padding:0;border-radius:0}.sheet .toolbar{display:none}html,body{background:#fff}.kpi{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- visitor mode ---- */
.guest-cta{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:14px}
.guest-cta .btn{justify-content:center;padding:10px}
.gv-hero{background:linear-gradient(135deg,var(--teal-ink),#1a7fa8);color:#fff;border-radius:18px;padding:26px 24px;margin-bottom:18px}
.gv-hero h2{font-family:var(--f-display);font-size:28px;margin:4px 0 8px;line-height:1.35}
.gv-hero p{margin:0;max-width:70ch;opacity:.93}
.gv-hero .steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gv-hero .steps span{border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:2px 12px;font-size:13px}
.gv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.gv-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.gv-card .ic{width:40px;height:40px;border-radius:10px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-size:20px;font-weight:700}
.gv-card h3{font-size:16.5px;margin:4px 0 0;color:var(--teal-ink)}
.gv-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.75}
.gv-card .btn{margin-top:auto;align-self:flex-start}
.gv-sec{font-family:var(--f-display);font-size:20px;margin:6px 0 10px}
.gv-tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.gv-tour{background:var(--surface);border:1.5px solid var(--teal);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.gv-tour h3{margin:0;font-size:17px}
.gv-tour p{margin:0;color:var(--muted);font-size:14px}
.gv-tour .row{display:flex;gap:6px;flex-wrap:wrap}
.gv-note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:18px}
.gv-subj{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.gv-subj span{border-radius:99px;padding:4px 14px;font-size:14px;color:#fff}
</style>

function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

op:10px}\n.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:120px;cursor:pointer;background:#fbfdfd}\n.bin:hover{border-color:var(--teal)}\n.bin h4{margin:0 0 6px;font-size:16px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px}\n.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:inherit}\n.chip svg{width:26px;height:26px}\n.chip.sel{border-color:var(--teal);background:var(--teal-s)}\n.chip.done{border-color:var(--good);background:var(--good-s);cursor:default}\n.chip.wrong{border-color:var(--bad);background:var(--bad-s)}\n.task{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}\n.task .q{font-weight:bold;margin-bottom:6px}\n.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}\n.flip{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:#fff;font:inherit;color:inherit;min-height:64px}\n.flip.back{background:var(--teal-s);border-color:var(--teal)}\n.hist{background:#fdf0f5;border:1px solid #f1c3d5;border-radius:12px;padding:10px 14px;font-size:15.5px}\n.hist b{color:#a8336a}\n[data-masar]{display:none}\n@media (max-width:560px){.bins{grid-template-columns:1fr}.hero h1{font-size:24px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"unit\">المهارات الرقمية · الصف الرابع الابتدائي · الوحدة الأولى: تعلم الأساسيات<\/div><h1>الدرس الأول: الحاسب<\/h1>\n<div class=\"goals\"><b>ستتعلم في هذا الدرس:<\/b><ul><li>ما الحاسب، وما الحاسب المكتبي.<\/li><li>المكونات الرئيسة للحاسب المكتبي.<\/li><li>الأجهزة الملحقة بالحاسب واستخداماتها.<\/li><li>الطباعة وطرق توصيل الطابعة.<\/li><\/ul><\/div><\/header>\n\n<section class=\"card\">\n<h2><span class=\"n\">1<\/span>ما الحاسب؟<\/h2>\n<p>الحاسب أحد أنواع الأجهزة الإلكترونية، يتبع <b>تعليمات محددة<\/b> ويتخذ القرارات ويقوم بالكثير من الأمور المفيدة.<\/p>\n<p>نستخدمه لكتابة النصوص، ورسم الصور وتنسيقها، وإرسال رسائل البريد الإلكتروني، وغير ذلك من المهام.<\/p>\n<h3>الحاسب المكتبي<\/h3>\n<p>هناك أنواع كثيرة من الحواسيب تختلف في حجمها وقدراتها، و<b>الحاسب المكتبي<\/b> أكثرها شيوعاً. يتكوّن من مجموعة أجهزة متصلة ببعضها تمكّنه من أداء المهام المختلفة.<\/p>\n<div class=\"hint\"><b>فكّر:<\/b> اذكر ثلاثة أشياء مفيدة تستطيع القيام بها باستخدام الحاسب.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">2<\/span>تعرّف على الأجهزة<\/h2>\n<p>اضغط على كل جهاز لتعرف اسمه بالإنجليزية واستخدامه ونوعه.<\/p>\n<div class=\"grid\" id=\"devGrid\"><\/div>\n<p style=\"margin-top:10px\"><span class=\"tag main\">مكوّن رئيس<\/span> الأجهزة الأساسية للحاسب المكتبي · <span class=\"tag ext\">جهاز ملحق<\/span> أجهزة نضيفها للحاسب لمهام إضافية<\/p>\n<p class=\"score\" id=\"devCount\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">3<\/span>نشاط: صنّف الأجهزة<\/h2>\n<p>اختر جهازاً، ثم اضغط على المجموعة التي ينتمي إليها.<\/p>\n<div class=\"row\" id=\"sortPool\"><\/div>\n<div class=\"bins\">\n <div class=\"bin\" data-bin=\"main\"><h4>١. مكوّنات الحاسب الرئيسة<\/h4><div class=\"items\"><\/div><\/div>\n <div class=\"bin\" data-bin=\"ext\"><h4>٢. الأجهزة الملحقة بالحاسب<\/h4><div class=\"items\"><\/div><\/div>\n<\/div>\n<div class=\"fb\" id=\"sortFb\"><\/div>\n<div class=\"row\"><button class=\"btn\" id=\"sortReset\">أعد النشاط<\/button><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">4<\/span>ماذا أحتاج لأنفّذ المهمة؟<\/h2>\n<p>اختر الجهاز المناسب لكل مهمة.<\/p>\n<div id=\"tasks\"><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">5<\/span>الطباعة<\/h2>\n<p>يمكنك طباعة النصوص والأرقام والصور والرسومات على الورق باستخدام جهاز ملحق بالحاسب اسمه <b>الطابعة<\/b>. توصَّل الطابعة بالحاسب عن طريق سلك <b>يو إس بي<\/b> <span class=\"en\">(USB)<\/span> أو عن طريق <b>الشبكة اللاسلكية<\/b> <span class=\"en\">(Wireless network)<\/span>.<\/p>\n<div class=\"info\">لطباعة أي مستند تأكد أولاً أن الحاسب متصل بالطابعة، وأن الطابعة تعمل.<\/div>\n<h3>جرّب: اطبع صورة الجمل<\/h3>\n<div class=\"row\" style=\"margin-top:6px\">\n <button class=\"btn\" id=\"tConn\">توصيل الطابعة بالحاسب<\/button>\n <button class=\"btn\" id=\"tPow\">تشغيل الطابعة<\/button>\n <button class=\"btn pri\" id=\"tPrint\">طباعة<\/button>\n<\/div>\n<div style=\"display:flex;gap:16px;align-items:flex-end;margin-top:12px;flex-wrap:wrap\">\n <div id=\"prn\" style=\"width:110px\"><\/div>\n <div id=\"paper\" style=\"width:120px;height:90px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--mut);font-size:13px;background:#fff\">الورقة<\/div>\n<\/div>\n<div class=\"fb\" id=\"printFb\"><\/div>\n<p>ويمكنك الطباعة على أحجام مختلفة من الورق، وعلى الملصقات أو المغلفات أيضاً.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">6<\/span>تذكّر<\/h2>\n<ul>\n<li>المكوّنات الرئيسة للحاسب المكتبي: <b>صندوق الحاسب، الشاشة، لوحة المفاتيح، الفأرة<\/b>.<\/li>\n<li>من الأجهزة الملحقة: <b>الطابعة، الميكروفون، مكبر الصوت، كاميرا الويب، الماسح الضوئي، سماعات الأذن، الكاميرا الرقمية<\/b>.<\/li>\n<\/ul>\n<\/section>\n\n<\/div>\n\n<ul data-masar=\"match\">\n <li>لوحة المفاتيح | كتابة نص<\/li>\n <li>الفأرة | تحريك المؤشر<\/li>\n <li>الماسح الضوئي | مسح المستندات والصور<\/li>\n <li>الميكروفون | تسجيل الصوت<\/li>\n <li>كاميرا الويب | التواصل المرئي عبر الإنترنت<\/li>\n<\/ul>\n<ol data-masar=\"training\">\n <li>الشاشة من: | *مكونات الحاسب الرئيسة | الأجهزة الملحقة بالحاسب<\/li>\n <li>الميكروفون من: | *الأجهزة الملحقة بالحاسب | مكونات الحاسب الرئيسة<\/li>\n <li>لإدخال صورة إلى الحاسب نستخدم: | *الماسح الضوئي | الميكروفون | سماعات الأذن<\/li>\n <li>قبل طباعة أي مستند تأكد أن: | *الحاسب متصل بالطابعة والطابعة تعمل | الشاشة مطفأة | السماعات متصلة<\/li>\n<\/ol>\n<ol data-masar=\"quiz\">\n <li>الحاسب جهاز إلكتروني: | *يتبع تعليمات محددة ويتخذ القرارات | يعمل دون أي تعليمات | يستخدم للاتصال الهاتفي فقط | لا يستطيع كتابة النصوص<\/li>\n <li>أيّ مما يلي من مكونات الحاسب المكتبي الرئيسة؟ | *لوحة المفاتيح | الطابعة | الماسح الضوئي | كاميرا الويب<\/li>\n <li>الجهاز الذي نستخدمه لمسح المستندات والصور: | *الماسح الضوئي | الميكروفون | مكبر الصوت | الشاشة<\/li>\n <li>توصَّل الطابعة بالحاسب عن طريق: | *سلك USB أو الشبكة اللاسلكية | سماعات الأذن | الميكروفون | كاميرا الويب<\/li>\n <li>للتواصل المرئي عبر الإنترنت نحتاج إلى: | *كاميرا الويب | الطابعة | الماسح الضوئي | الفأرة<\/li>\n <li>للاستماع إلى الملفات الصوتية نستخدم: | *سماعات الأذن | الماسح الضوئي | الطابعة | الفأرة<\/li>\n<\/ol>\n\n<\script>\nconst ICON={\nmonitor:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"34\" rx=\"3\" fill=\"#2f3e46\"/><rect x=\"10\" y=\"12\" width=\"44\" height=\"26\" fill=\"#4fb3e8\"/><path d=\"M14 32 C24 22 34 34 50 20\" stroke=\"#bfe8ff\" stroke-width=\"2\" fill=\"none\"/><rect x=\"28\" y=\"42\" width=\"8\" height=\"8\" fill=\"#9aa5ab\"/><rect x=\"18\" y=\"50\" width=\"28\" height=\"5\" rx=\"2\" fill=\"#c3cbcf\"/><\/svg>',\ncase:'<svg viewBox=\"0 0 64 64\"><rect x=\"18\" y=\"4\" width=\"28\" height=\"56\" rx=\"3\" fill=\"#e8ecef\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"22\" y=\"10\" width=\"20\" height=\"5\" fill=\"#9aa5ab\"/><rect x=\"22\" y=\"18\" width=\"20\" height=\"3\" fill=\"#c3cbcf\"/><circle cx=\"32\" cy=\"34\" r=\"4\" fill=\"#3fbf6b\"/><g fill=\"#9aa5ab\"><rect x=\"24\" y=\"46\" width=\"16\" height=\"2\"/><rect x=\"24\" y=\"50\" width=\"16\" height=\"2\"/><rect x=\"24\" y=\"54\" width=\"16\" height=\"2\"/><\/g><\/svg>',\nkeyboard:'<svg viewBox=\"0 0 64 64\"><rect x=\"4\" y=\"20\" width=\"56\" height=\"26\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><g fill=\"#9aa5ab\"><rect x=\"9\" y=\"25\" width=\"5\" height=\"4\"/><rect x=\"16\" y=\"25\" width=\"5\" height=\"4\"/><rect x=\"23\" y=\"25\" width=\"5\" height=\"4\"/><rect x=\"30\" y=\"25\" width=\"5\" height=\"4\"/><rect x=\"37\" y=\"25\" width=\"5\" height=\"4\"/><rect x=\"44\" y=\"25\" width=\"5\" height=\"4\"/><rect x=\"51\" y=\"25\" width=\"4\" height=\"4\"/><rect x=\"9\" y=\"31\" width=\"5\" height=\"4\"/><rect x=\"16\" y=\"31\" width=\"5\" height=\"4\"/><rect x=\"23\" y=\"31\" width=\"5\" height=\"4\"/><rect x=\"30\" y=\"31\" width=\"5\" height=\"4\"/><rect x=\"37\" y=\"31\" width=\"5\" height=\"4\"/><rect x=\"44\" y=\"31\" width=\"11\" height=\"4\"/><rect x=\"16\" y=\"38\" width=\"32\" height=\"4\"/><\/g><\/svg>',\nmouse:'<svg viewBox=\"0 0 64 64\"><rect x=\"18\" y=\"8\" width=\"28\" height=\"46\" rx=\"14\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><line x1=\"32\" y1=\"9\" x2=\"32\" y2=\"26\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"30\" y=\"14\" width=\"4\" height=\"8\" rx=\"2\" fill=\"#6c7a80\"/><path d=\"M8 4 Q20 2 32 9\" stroke=\"#6c7a80\" stroke-width=\"2\" fill=\"none\"/><\/svg>',\nprinter:'<svg viewBox=\"0 0 64 64\"><rect x=\"18\" y=\"6\" width=\"28\" height=\"16\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"6\" y=\"20\" width=\"52\" height=\"24\" rx=\"4\" fill=\"#3b464c\"/><rect x=\"12\" y=\"26\" width=\"12\" height=\"7\" fill=\"#9fe08a\"/><circle cx=\"48\" cy=\"30\" r=\"2.5\" fill=\"#ccc\"/><rect x=\"16\" y=\"40\" width=\"32\" height=\"18\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"21\" y=\"45\" width=\"22\" height=\"2\" fill=\"#c3cbcf\"/><rect x=\"21\" y=\"50\" width=\"16\" height=\"2\" fill=\"#c3cbcf\"/><\/svg>',\nmic:'<svg viewBox=\"0 0 64 64\"><rect x=\"36\" y=\"4\" width=\"9\" height=\"20\" rx=\"4.5\" transform=\"rotate(30 40 14)\" fill=\"#6c7a80\"/><path d=\"M36 22 Q28 34 32 46\" stroke=\"#3b464c\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"32\" cy=\"54\" rx=\"16\" ry=\"5\" fill=\"#3b464c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"6\" fill=\"#3b464c\"/><\/svg>',\nspeakers:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"12\" width=\"22\" height=\"42\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"17\" cy=\"24\" r=\"5\" fill=\"#9aa5ab\"/><circle cx=\"17\" cy=\"42\" r=\"8\" fill=\"#6c7a80\"/><rect x=\"36\" y=\"12\" width=\"22\" height=\"42\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"47\" cy=\"24\" r=\"5\" fill=\"#9aa5ab\"/><circle cx=\"47\" cy=\"42\" r=\"8\" fill=\"#6c7a80\"/><\/svg>',\nwebcam:'<svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"24\" r=\"16\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"32\" cy=\"24\" r=\"9\" fill=\"#3b464c\"/><circle cx=\"32\" cy=\"24\" r=\"4\" fill=\"#4fb3e8\"/><circle cx=\"35\" cy=\"21\" r=\"1.5\" fill=\"#fff\"/><path d=\"M22 52 Q32 36 42 52 Z\" fill=\"#9aa5ab\"/><rect x=\"18\" y=\"52\" width=\"28\" height=\"5\" rx=\"2\" fill=\"#6c7a80\"/><\/svg>',\nscanner:'<svg viewBox=\"0 0 64 64\"><path d=\"M8 20 L52 6 L56 12 L12 26 Z\" fill=\"#dfe5e8\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"6\" y=\"30\" width=\"52\" height=\"18\" rx=\"3\" fill=\"#eef1f3\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"10\" y=\"33\" width=\"44\" height=\"5\" fill=\"#bfe8ff\"/><circle cx=\"48\" cy=\"43\" r=\"2\" fill=\"#3fbf6b\"/><\/svg>',\nheadphones:'<svg viewBox=\"0 0 64 64\"><path d=\"M12 38 V30 A20 20 0 0 1 52 30 V38\" stroke=\"#3b464c\" stroke-width=\"5\" fill=\"none\"/><rect x=\"6\" y=\"34\" width=\"14\" height=\"22\" rx=\"6\" fill=\"#d23b3b\"/><rect x=\"44\" y=\"34\" width=\"14\" height=\"22\" rx=\"6\" fill=\"#d23b3b\"/><\/svg>',\ncamera:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"16\" width=\"52\" height=\"36\" rx=\"5\" fill=\"#8fa3ad\"/><rect x=\"12\" y=\"12\" width=\"14\" height=\"6\" rx=\"2\" fill=\"#6c7a80\"/><circle cx=\"38\" cy=\"34\" r=\"13\" fill=\"#3b464c\"/><circle cx=\"38\" cy=\"34\" r=\"8\" fill=\"#4fb3e8\"/><rect x=\"11\" y=\"22\" width=\"9\" height=\"5\" fill=\"#9fe08a\"/><\/svg>',\nfolder:'<svg viewBox=\"0 0 64 64\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg>',\ndoc:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"18\" y=\"26\" width=\"22\" height=\"18\" rx=\"2\" fill=\"#2b5fb9\"/><text x=\"29\" y=\"40\" font-size=\"13\" font-family=\"Arial\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">W<\/text><\/svg>',\ntxt:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><g fill=\"#c3cbcf\"><rect x=\"20\" y=\"24\" width=\"26\" height=\"2\"/><rect x=\"20\" y=\"30\" width=\"26\" height=\"2\"/><rect x=\"20\" y=\"36\" width=\"26\" height=\"2\"/><rect x=\"20\" y=\"42\" width=\"18\" height=\"2\"/><\/g><\/svg>',\nppt:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><rect x=\"18\" y=\"26\" width=\"22\" height=\"18\" rx=\"2\" fill=\"#c8512f\"/><text x=\"29\" y=\"40\" font-size=\"13\" font-family=\"Arial\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">P<\/text><\/svg>',\nimg:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"10\" width=\"52\" height=\"44\" rx=\"3\" fill=\"#e8f6ff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><circle cx=\"46\" cy=\"22\" r=\"5\" fill=\"#f2c14e\"/><path d=\"M8 50 L24 30 L36 44 L44 36 L56 50 Z\" fill=\"#3fa36b\"/><\/svg>',\naudio:'<svg viewBox=\"0 0 64 64\"><path d=\"M14 4 h26 l12 12 v44 H14z\" fill=\"#fff\" stroke=\"#9aa5ab\" stroke-width=\"2\"/><path d=\"M28 44 V24 L42 20 V40\" stroke=\"#8b55d0\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"25\" cy=\"44\" r=\"4\" fill=\"#8b55d0\"/><circle cx=\"39\" cy=\"40\" r=\"4\" fill=\"#8b55d0\"/><\/svg>',\nvideo:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"12\" width=\"52\" height=\"40\" rx=\"4\" fill=\"#3b464c\"/><path d=\"M27 23 L41 32 L27 41 Z\" fill=\"#fff\"/><\/svg>'\n};\nfunction ic(n){return ICON[n]||''}\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction fb(el,ok,msg){el.className='fb '+(ok?'ok':'no');el.textContent=msg}\n\n\nconst DEV=[\n {k:'case',ar:'صندوق الحاسب',en:'Computer Case',t:'main',use:'يحتوي على أجزاء الحاسب الداخلية التي تشغّله.'},\n {k:'monitor',ar:'الشاشة',en:'Monitor',t:'main',use:'عرض شاشات البرامج.'},\n {k:'keyboard',ar:'لوحة المفاتيح',en:'Keyboard',t:'main',use:'كتابة النصوص والأرقام.'},\n {k:'mouse',ar:'الفأرة',en:'Mouse',t:'main',use:'تحريك المؤشر والضغط على الأشياء.'},\n {k:'printer',ar:'الطابعة',en:'Printer',t:'ext',use:'طباعة صفحة على الورق.'},\n {k:'mic',ar:'الميكروفون',en:'Microphone',t:'ext',use:'تسجيل الصوت.'},\n {k:'speakers',ar:'مكبر الصوت',en:'Speakers',t:'ext',use:'الاستماع إلى الملفات الصوتية.'},\n {k:'webcam',ar:'كاميرا الويب',en:'Webcam',t:'ext',use:'التواصل المرئي عبر الإنترنت.'},\n {k:'scanner',ar:'الماسح الضوئي',en:'Scanner',t:'ext',use:'مسح المستندات والصور وإدخالها للحاسب.'},\n {k:'headphones',ar:'سماعات الأذن',en:'Headphones',t:'ext',use:'الاستماع إلى الملفات الصوتية.'},\n {k:'camera',ar:'الكاميرا الرقمية',en:'Digital Camera',t:'ext',use:'التقاط الصور أو مقاطع الفيديو.'}\n];\nconst TAGS={main:'<span class=\"tag main\">مكوّن رئيس<\/span>',ext:'<span class=\"tag ext\">جهاز ملحق<\/span>'};\nconst seen=new Set();\nconst g=document.getElementById('devGrid');\ng.innerHTML=DEV.map((d,i)=>`<button class=\"dev\" data-i=\"${i}\">${ic(d.k)}<span class=\"nm\">${d.ar}<\/span><span class=\"en\">${d.en}<\/span><div class=\"more\">${TAGS[d.t]}<div>${d.use}<\/div><\/div><\/button>`).join('');\nfunction cnt(){document.getElementById('devCount').textContent=seen.size===DEV.length?'أحسنت! تعرّفت على جميع الأجهزة.':`تعرّفت على ${seen.size} من ${DEV.length} أجهزة`}\ng.addEventListener('click',e=>{const b=e.target.closest('.dev');if(!b)return;b.classList.toggle('open');seen.add(+b.dataset.i);cnt()});cnt();\n\n/* sorting */\nlet sel=null,done=0,err=0;\nfunction sortInit(){sel=null;done=0;err=0;\n document.querySelectorAll('.bin .items').forEach(x=>x.innerHTML='');\n const pool=document.getElementById('sortPool');\n pool.innerHTML=shuffle(DEV.map((d,i)=>i)).map(i=>`<button class= ,'إجابة صحيحة!')}else{c.classList.add('wrong');fb(f,false,'ليس هذا الجهاز، جرّب غيره.')}});\n\n/* printing */\nlet conn=false,pow=false;\nconst pf=document.getElementById('printFb');\ndocument.getElementById('tConn').onclick=e=>{conn=!conn;e.target.classList.toggle('on',conn)};\ndocument.getElementById('tPow').onclick=e=>{pow=!pow;e.target.classList.toggle('on',pow)};\ndocument.getElementById('tPrint').onclick=()=>{\n const p=document.getElementById('paper');\n if(!conn){fb(pf,false,'الحاسب غير متصل بالطابعة. وصّلها أولاً.');return}\n if(!pow){fb(pf,false,'الطابعة لا تعمل. شغّلها أولاً.');return}\n p.innerHTML='<svg viewBox=\"0 0 120 90\" width=\"110\"><rect width=\"120\" height=\"90\" fill=\"#e9f6ff\"/><circle cx=\"98\" cy=\"18\" r=\"9\" fill=\"#f2c14e\"/><path d=\"M0 78 H120 V90 H0z\" fill=\"#e8c27a\"/><path d=\"M28 72 q-2-18 10-22 q4-14 14-8 q6-10 14-2 q10-2 12 10 q8 4 6 22 h-6 v-12 h-6 v12 h-6 v-12 h-24 v12 h-6 v-12 h-4 v12z\" fill=\"#a8693a\"/><\/svg>';\n fb(pf,true,'تمت الطباعة بنجاح!')};\ndocument.getElementById('prn').innerHTML=ic('printer');\n\n<\/script>\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>الدرس الثاني: سطح المكتب<\/title>\n<meta name=\"masar-grades\" content=\"4\">\n<meta name=\"masar-unit\" content=\"الوحدة الأولى: تعلم الأساسيات\">\n<style>\n:root{--teal:#11897f;--teal-d:#0b5f58;--teal-s:#e2f3f0;--ink:#16302d;--mut:#5b706d;--line:#d8e3e0;--bg:#f5faf9;\n--good:#1e8a4c;--good-s:#e1f3e8;--bad:#c43c3c;--bad-s:#fbe4e2;--sun:#f2a516;--sky:#2b8dbf}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Tahoma,\"Segoe UI\",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;font-size:17px}\n.wrap{max-width:920px;margin:0 auto;padding:16px}\n.hero{background:linear-gradient(135deg,#0b5f58,#1a7fa8);color:#fff;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden}\n.hero::after{co  0 8px rgba(242,165,22,.1)}}\n@media (prefers-reduced-motion:reduce){.hs .dot{animation:none}}\n.deskInfo{margin-top:10px;min-height:56px}\n.tree{font-size:16px}\n.tree ul{list-style:none;padding-inline-start:24px;margin:4px 0;border-inline-start:2px dashed var(--line)}\n.tree li{margin:4px 0}\n.tree .f{display:inline-flex;align-items:center;gap:6px}\n.tree svg{width:24px;height:24px}\n.anat{display:flex;gap:4px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin-top:10px;direction:ltr}\n.anat span{border-radius:8px;padding:4px 10px;font-weight:bold}\n.anat .nmP{background:#e4edff;color:#2f5fc4}.anat .dt{background:#f2a516;color:#fff}.anat .ex{background:#fdeee0;color:#b0560c}\ninput.t{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;min-width:0;width:240px;max-width:100%}\n.fold{border:2px solid var(--line);border-radius:12px;padding:8px;min-height:110px;background:#fffbea}\n.fold h4{margin:0 0 6px;display:flex;align-items:center;gap:6px;font-size:16px}\n.fold h4 svg{width:28px;height:28px}\n.file{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:3px;font-size:15px;transition:.3s}\n.file svg{width:24px;height:24px}\n.file.ghost{opacity:.35;border-style:dashed}\n.calc{width:240px;max-width:100%;background:#eef3f6;border:1px solid var(--line);border-radius:12px;padding:10px;direction:ltr}\n.calc .scr{background:#fff;border-radius:8px;padding:6px 10px;text-align:right;font-size:26px;font-family:\"Segoe UI\",Arial;min-height:46px;overflow:hidden;white-space:nowrap}\n.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}\n.calc button{font:inherit;font-size:18px;padding:8px 0;border:0;border-radius:8px;background:#fff;cursor:pointer}\n.calc button.op{background:#d9ecf7}.calc button.eq{background:var(--teal);color:#fff}\n.order{display:flex;flex-direction:column;gap:6px;margin-top:8px}\n.order .chip{justify-content:flex-start}\n.order .chip .num{background:var(--teal);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px}\n<\/style>\n\n<section class=\"card\">\n<h2><span class=\"n\">1<\/span>سطح المكتب<\/h2>\n<p>عند بدء تشغيل الحاسب تظهر الشاشة الرئيسة لنظام التشغيل <b>مايكروسوفت ويندوز<\/b> <span class=\"en\">(Microsoft Windows)<\/span>. تسمى هذه النافذة <b>سطح المكتب<\/b> <span class=\"en\">(Desktop)<\/span>، وتتكون من شريط المهام، ومساحة العمل، وبعض الرموز، وزر بدء.<\/p>\n<p>اضغط على النقاط البرتقالية لتكتشف أجزاء سطح المكتب.<\/p>\n<div class=\"desk\" id=\"desk\">\n <div class=\"win\"><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n <div style=\"position:absolute;right:3%;top:5%;width:7%;text-align:center;color:#fff;font-size:11px\"><svg viewBox=\"0 0 40 40\" width=\"34\"><path d=\"M10 12h20l-2 24H12z\" fill=\"#cfe6f5\" stroke=\"#fff\"/><rect x=\"8\" y=\"9\" width=\"24\" height=\"3\" fill=\"#e8f3fb\"/><path d=\"M16 20l4-3 4 3M20 17v10\" stroke=\"#2b8dbf\" stroke-width=\"2\" fill=\"none\"/><\/svg><div>سلة المحذوفات<\/div><\/div>\n <div class=\"tb\">\n  <svg viewBox=\"0 0 20 20\" width=\"22\" style=\"flex:none\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\" fill=\"#7fc3ff\"/><rect x=\"11\" y=\"1\" width=\"8\" height=\"8\" fill=\"#7fc3ff\"/><rect x=\"1\" y=\"11\" width=\"8\" height=\"8\" fill=\"#7fc3ff\"/><rect x=\"11\" y=\"11\" width=\"8\" height=\"8\" fill=\"#7fc3ff\"/><\/svg>\n  <svg viewBox=\"0 0 20 20\" width=\"18\" style=\"flex:none\"><circle cx=\"8\" cy=\"8\" r=\"5\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\"/><line x1=\"12\" y1=\"12\" x2=\"17\" y2=\"17\" stroke=\"#fff\" stroke-width=\"2\"/><\/svg>\n  <svg viewBox=\"0 0 20 20\" width=\"22\" style=\"flex:none\"><path d=\"M2 5h6l2 2h8v10H2z\" fill=\"#f2c14e\"/><\/svg>\n  <svg viewBox=\"0 0 20 20\" width=\"22\" style=\"flex:none\"><circle cx=\"10\" cy=\"10\" r=\"8\" fill=\"#1fa0c9\"/><circle cx=\"11\" cy=\"11\" r=\"4\" fill=\"#3fd18a\"/><\/svg>\n  <span style=\"flex:1\"><\/span>\n  <span style=\"color:#fff;font-size:11px\">ENG<\/span>\n  <svg viewBox=\"0 0 20 20\" width=\"16\"><path d=\"M3 8h3l4-4v12l-4-4H3z\" fill=\"#fff\"/><path d=\"M13 7q3 3 0 6\" stroke=\"#fff\" fill=\"none\"/><\/svg>\n  <svg viewBox=\"0 0 20 20\" width=\"16\"><rect x=\"2\" y=\"5\" width=\"14\" height=\"9\" stroke=\"#fff\" fill=\"none\"/><rect x=\"7\" y=\"15\" width=\"4\" height=\"2\" fill=\"#fff\"/><\/svg>\n  <span style=\"color:#fff;font-size:11px;line-height:1.2;text-align:center\" id=\"clk\">١٢:٠٠<br>٢٠٢٦/١٠/٦<\/span>\n <\/div>\n<\/div>\n<div class=\"deskInfo info\" id=\"deskInfo\">اضغط على أي نقطة لتعرف اسم الجزء ووظيفته.<\/div>\n<p class=\"score\" id=\"deskCount\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">2<\/span>الملفات<\/h2>\n<p>المهمة الرئيسة للحاسب هي إدارة البيانات والمعلومات. تسمى البيانات المخزنة في الحاسب <b>الملفات<\/b> <span class=\"en\">(Files)<\/span>. قد يكون الملف نصاً، أو صورة، أو ملفاً صوتياً، أو عرضاً تقديمياً، أو فيديو. ولكل نوع أيقونة تساعدك على معرفته.<\/p>\n<div class=\"grid\" id=\"ftypes\"><\/div>\n<h3>اسم الملف<\/h3>\n<p>احفظ ملفاتك بأسماء فريدة تناسب محتواها، لتجدها بسهولة وتعرف ما فيها. وتجنّب الأسماء العامة مثل «ملف1» و«ملفي».<\/p>\n<h3>امتداد الملف<\/h3>\n<p>لكل ملف <b>امتداد<\/b> يشير إلى نوعه، وتوجد دائماً <b>نقطة<\/b> بين اسم الملف وامتداده. اكتب اسم ملف وشاهد أجزاءه:<\/p>\n<div class=\"row\"><input class=\"t\" id=\"fname\" value=\"النحو.docx\" dir=\"auto\" aria-label=\"اسم الملف\"><\/div>\n<div class=\"anat\" id=\"anat\"><\/div>\n<div class=\"fb\" id=\"fnameFb\"><\/div>\n<h3>نقل الملفات<\/h3>\n<p>تُخزَّن الملفات على الحاسب أو الهاتف الذكي أو ذاكرة الكاميرا الرقمية. ويمكن نقلها بين الأجهزة بتوصيلها ببعض، أو عبر الشبكة المحلية، أو عبر التخزين السحابي.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">3<\/span>إنشاء الملفات وفتحها وحذفها<\/h2>\n<p>نستخدم برامج مختلفة لإنشاء الملفات حسب نوعها: مستند في <b>مايكروسوفت وورد<\/b>، وصورة في <b>الرسام<\/b> <span class=\"en\">(Paint)<\/span>.<\/p>\n<h3>لإنشاء ملف صورة باستخدام الرسام<\/h3>\n<ol class=\"steps\">\n <li>اضغط زر <b>بدء<\/b> <span class=\"en\">(Start)<\/span> ثم <b>البرامج الملحقة لويندوز<\/b>.<\/li>\n <li>اضغط على <b>الرسام<\/b> <span class=\"en\">(Paint)<\/span> وارسم ما يعجبك.<\/li>\n <li>اضغط <b>ملف<\/b> <span class=\"en\">(File)<\/span> ثم <b>حفظ<\/b> <span class=\"en\">(Save)<\/span>.<\/li>\n <li>اكتب اسم الملف ثم اضغط <b>حفظ<\/b>.<\/li>\n<\/ol>\n<h3>فتح ملف<\/h3>\n<p>حدد موقع الملف واضغط عليه <b>ضغطة مزدوجة<\/b>، أو اضغط عليه بزر الفأرة الأيمن واختر <b>فتح<\/b> <span class=\"en\">(Open)<\/span>.<\/p>\n<h3>حذف ملف<\/h3>\n<p>اضغط بزر الفأرة الأيمن على الملف، ثم اختر <b>حذف<\/b> <span class=\"en\">(Delete)<\/span>. يذهب الملف إلى <b>سلة المحذوفات<\/b>.<\/p>\n<div class=\"hist\"><b>لمحة تاريخية:<\/b> استُخدم مصطلح «ملف» لأول مرة للإشارة إلى تخزين البيانات في الحاسب عام 1950.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">4<\/span>المجلدات<\/h2>\n<p><b>المجلد<\/b> <span class=\"en\">(Folder)<\/span> مساحة تخزينية على القرص الصلب تحفظ فيها ملفاتك وبرامجك وتنظمها.<\/p>\n<h3>لإنشاء مجلد جديد<\/h3>\n<ol class=\"steps\">\n <li>اضغط زر <b>بدء<\/b> ثم <b>المستندات<\/b> <span class=\"en\">(Documents)<\/span>.<\/li>\n <li>اضغط بزر الفأرة الأيمن على منطقة فارغة.<\/li>\n <li>اختر <b>جديد<\/b> <span class=\"en\">(New)<\/span> ثم <b>مجلد<\/b> <span class=\"en\">(Folder)<\/span>.<\/li>\n <li>اكتب اسماً للمجلد ثم اضغط <b>Enter<\/b>.<\/li>\n<\/ol>\n<h3>نشاط: رتّب خطوات إنشاء مجلد على سطح المكتب<\/h3>\n<p>اضغط على الخطوات بالترتيب الصحيح.<\/p>\n<div class=\"order\" id=\"order\"><\/div>\n<div class=\"fb\" id=\"orderFb\"><\/div>\n<div class=\"row\"><button class=\"btn\" id=\"orderReset\">أعد الترتيب<\/button><\/div>\n\n<h3>اسم المجلد<\/h3>\n<p>يُفضَّل أن يصف اسم المجلد محتوياته. ولإعادة تسميته: اضغط بزر الفأرة الأيمن عليه، واختر <b>إعادة التسمية<\/b> <span class=\"en\">(Rename)<\/span>، واكتب الاسم الجديد، ثم اضغط <b>Enter<\/b>.<\/p>\n<div class=\"info\">يمكنك استخدام الحروف والأرقام في اسم المجلد، لكن <b>لا تستخدم الرموز<\/b> <span class=\"en\">/ \\ : * ? \" &lt; &gt; |<\/span> وينطبق ذلك على أسماء الملفات.<\/div>\n<p style=\"margin-top:8px\">جرّب: اكتب اسم مجلد وتحقق هل هو مقبول.<\/p>\n<div class=\"row\"><input class=\"t\" id=\"foldName\" value=\"الصيف / الشتاء\" dir=\"auto\" aria-label=\"اسم المجلد\"><button class=\"btn pri\" id=\"foldCheck\">تحقّق<\/button><\/div>\n<div class=\"fb\" id=\"foldFb\"><\/div>\n\n<h3>المجلدات الرئيسة والمجلدات الفرعية<\/h3>\n<p><b>المجلد الفرعي<\/b> مجلد داخل مجلد آخر. مثال: داخل مجلد «المواد الدراسية» خمسة مجلدات فرعية. وتستخدم زر الخلف <span class=\"en\">(Back)<\/span> للعودة إلى المجلد الرئيس.<\/p>\n<div class=\"tree\"><div class=\"f\"><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> <b>المواد الدراسية<\/b><\/div>\n <ul><li class=\"f\"><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> توحيد<\/li><li class=\"f\"><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> رياضيات<\/li><li class=\"f\"><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> علوم<\/li><li class=\"f\"><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> قراءة<\/li><li class=\"f\"><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> كتابة<\/li><\/ul><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">5<\/span>نسخ الملف ونقله<\/h2>\n<p><b>النسخ<\/b> <span class=\"en\">(Copy)<\/span>: إنشاء نسخة جديدة من الملف مع بقاء الأصل في مكانه.<br><b>النقل<\/b> <span class=\"en\">(Cut ثم Paste)<\/span>: نقل الملف من مكان إلى آخر مع حذفه من المكان الأصلي.<\/p>\n<p>جرّب بنفسك على ملف «الدرس 1»:<\/p>\n<div class=\"bins\">\n <div class=\"fold\" id=\"fa\"><h4><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> المواد الدراسية<\/h4><div class=\"items\"><\/div><\/div>\n <div class=\"fold\" id=\"fb2\"><h4><svg viewBox=\"0 0 64 64\" width=\"24\" height=\"24\"><path d=\"M4 16 h20 l6 6 h30 v32 H4z\" fill=\"#f2c14e\"/><path d=\"M4 24 h56 v30 H4z\" fill=\"#f7d371\"/><\/svg> علوم<\/h4><div class=\"items\"><\/div><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:10px\"><button class=\"btn\" id=\"bCopy\">نسخ ثم لصق في «علوم»<\/button><button class=\"btn\" id=\"bCut\">قص ثم لصق في «علوم»<\/button><button class=\"btn\" id=\"bReset\">إعادة<\/button><\/div>\n<div class=\"fb\" id=\"cfb\"><\/div>\n<div class=\"hint\"><b>معلومة:<\/b> سحب المجلد أو الملف وإفلاته في موقع آخر على الحاسب نفسه ينقله، أما سحبه إلى جهاز تخزين ملحق فيعمل نسخة منه.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">6<\/span>استخدام البرامج: الحاسبة<\/h2>\n<p>يحتوي الحاسب على برامج كثيرة للعمل أو الترفيه، منها <b>الحاسبة<\/b> <span class=\"en\">(Calculator)<\/span> لإجراء الحسابات.<\/p>\n<ol class=\"steps\"><li>اضغط زر <b>بدء<\/b> <span class=\"en\">(Start)<\/span>.<\/li><li>مرّر قائمة التطبيقات للأسفل واضغط على <b>الحاسبة<\/b>.<\/li><li>ستعمل الحاسبة، ويمكنك الآن إجراء عملية حسابية.<\/li><\/ol>\n<p>ويمكنك أيضاً فتحها بالضغط على زر البحث وكتابة اسمها، أو من رمزها على شريط المهام أو سطح المكتب.<\/p>\n<h3>جرّب الحاسبة<\/h3>\n<div class=\"calc\"><div class=\"scr\" id=\"scr\">0<\/div><div class=\"keys\" id=\"keys\"><\/div><\/div>\n<div class=\"hint\" style=\"margin-top:10px\"><b>معلومة:<\/b> يمكنك كتابة الأرقام من مفاتيح الأرقام في الجزء الأيمن من لوحة المفاتيح، بعد التأكد من تشغيل زر <span class=\"en\">Num Lock<\/span>.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2><span class=\"n\">7<\/span>البحث عن مساعدة<\/h2>\n<ol class=\"steps\">\n <li>اضغط زر <b>بدء<\/b>، ثم اضغط على <b>الحصول على التعليمات<\/b> <span class=\"en\">(Get Help)<\/span>.<\/li>\n <li>صف مشكلتك، مثل: «لا أستطيع الطباعة»، ثم اضغط <b>إرسال الرسالة<\/b>.<\/li>\n <li>أكّد المشكلة بالضغط على <b>نعم<\/b>، ثم اختر أحد الحلول المقترحة.<\/li>\n <li>اقرأ الخطوات واتبعها بعناية لحل مشكلتك.<\/li>\n<\/ol>\n<\/section>\n\n<\/div>\n\n<ul data-masar=\"match\">\n <li>سلة المحذوفات | تذهب إليها الملفات المحذوفة<\/li>\n <li>زر بدء | يفتح قائمة البرامج<\/li>\n <li>المجلد | مساحة لحفظ الملفات وتنظيمها<\/li>\n <li>النسخ | نسخة جديدة مع بقاء الأصل<\/li>\n <li>النقل | نقل الملف وحذفه من مكانه الأصلي<\/li>\n<\/ul>\n<ol data-masar=\"training\">\n <li>لإنشاء ملف صورة نستخدم برنامج: | *الرسام | الحاسبة | الحصول على التعليمات<\/li>\n <li>لحذف ملف نضغط عليه بزر الفأرة الأيمن ثم نختار: | *حذف | فتح | نسخ<\/li>\n <li>إذا أردت أن يصبح لديك مجلدان متطابقان تختار: | *نسخ | قص | حذف<\/li>\n <li>بين اسم الملف وامتداده توجد دائماً: | *نقطة | فاصلة | مسافة<\/li>\n<\/ol>\n<ol data-masar=\"quiz\">\n <li>تسمى النافذة الرئيسة التي تظهر عند تشغيل ويندوز: | *سطح المكتب | شريط المهام | سلة المحذوفات | مستكشف الملفات<\/li>\n <li>في اسم الملف «النحو.docx» الامتداد هو: | *docx | النحو | النقطة | الأيقونة<\/li>\n <li>نقل الملف يعني: | *نقله إلى مكان آخر مع حذفه من مكانه الأصلي | إنشاء نسخة مع بقاء الأصل | حذفه نهائياً | تغيير اسمه<\/li>\n <li>أيّ أسماء المجلدات الآتية مقبول؟ | *المنزل | أعلى/أسفل | الصيف / الشتاء | &lt;المصاريف&gt;<\/li>\n <li>المجلد الفرعي هو: | *مجلد داخل مجلد آخر | ملف صورة | برنامج للرسم | سلة المحذوفات<\/li>\n <li>لفتح ملف نضغط عليه: | *ضغطة مزدوجة | ضغطة بالزر الأيمن ثم حذف | سحبه إلى سلة المحذوفات | ضغطة على زر Num Lock<\/li>\n<\/ol>\n\n<\script>\nconst ICON={\nmonitor:'<svg viewBox=\"0 0 64 64\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"34\"
