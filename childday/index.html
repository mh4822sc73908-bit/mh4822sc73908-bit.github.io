:root{
  --tq:#36B0CC; --pu:#5454AF; --wh:#FFFFFF;
  --gold:#F7E3B5; --gr:#B7E5B7; --lgr:#E8F8EE; --pk:#F9E8F7; --ye:#FFF8E8; --gy:#EEEFF2;
  --ink:#2E2E6E; --ink2:#4B4B78; --ok:#2E8B57; --okbg:#E8F8EE; --no:#B4436C; --nobg:#FCEEF4;
  --tq-d:#1F7F96; --pu-d:#3E3E8C;
  --r:22px; --r-s:14px;
  --sh:0 6px 20px rgba(84,84,175,.12);
  --font:"Playpen Sans Arabic","Playpen Sans","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:#FBFBFE;line-height:1.75;font-size:17px;-webkit-text-size-adjust:100%}
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pu);outline-offset:3px;border-radius:10px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;right:12px;top:-60px;background:var(--pu);color:#fff;padding:8px 14px;border-radius:10px;z-index:99}
.skip:focus{top:10px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gy)}
.top-in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand img{height:46px;width:auto;min-width:60px}
.brand .bt{font-weight:700;font-size:14px;line-height:1.3;text-align:right;color:var(--pu)}
.brand .bt small{display:block;color:var(--ink2);font-weight:400;font-size:12px}
.top-sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.who b{color:var(--pu)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ye);border:1px solid var(--gold);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--pu-d)}
.iconbtn{background:#fff;border:2px solid var(--gy);border-radius:12px;min-height:44px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--pu)}
.iconbtn:hover{border-color:var(--tq)}
@media (max-width:640px){.brand .bt{display:none}.who .nm{display:none}.top-in{gap:8px;padding:6px 10px}}

main{max-width:1100px;margin:auto;padding:18px 16px 40px;min-height:70vh}
h1,h2,h3{line-height:1.35;margin:.2em 0 .5em;color:var(--pu)}
h1{font-size:clamp(26px,5vw,40px);font-weight:800}
h2{font-size:clamp(22px,4vw,30px);font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:.4em 0 .8em}
.lead{font-size:18px;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 24px;border-radius:16px;border:0;font-weight:700;font-size:18px;background:var(--pu);color:#fff;box-shadow:0 4px 0 var(--pu-d);transition:transform .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pu-d)}
.btn.tq{background:var(--tq);box-shadow:0 4px 0 var(--tq-d)}
.btn.soft{background:#fff;color:var(--pu);border:2px solid var(--pu);box-shadow:none}
.btn.ghost{background:transparent;color:var(--pu);box-shadow:none;border:2px dashed #C9C9EA}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.sm{min-height:44px;font-size:16px;padding:8px 16px;border-radius:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{justify-content:flex-end}
.row.c{justify-content:center}

.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:22px;border:1px solid #F0F0F7}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

/* hero / login */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(160deg,#fff 0%,var(--lgr) 100%);padding:26px 22px;border:1px solid #E3F1EA}
.hero .sq{position:absolute;opacity:.9;pointer-events:none}
.hero .in{position:relative;z-index:1}
.logo-big{width:min(320px,70vw);margin:4px auto 6px}
.slogan{display:inline-block;background:var(--pu);color:#fff;font-weight:800;padding:6px 22px;border-radius:999px;font-size:22px}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.date{background:#fff;border-radius:16px;padding:10px 14px;border:2px solid var(--gold);font-size:15px}
.date b{display:block;color:var(--pu);font-size:17px}

.login{max-width:560px;margin:18px auto 0}
.field{margin:12px 0}
.field label{display:block;font-weight:700;margin-bottom:6px}
.inp{width:100%;min-height:52px;border:2px solid #D8D8EE;border-radius:14px;padding:8px 14px;background:#fff;font-size:18px}
.inp:focus{border-color:var(--tq);outline:none;box-shadow:0 0 0 4px rgba(54,176,204,.2)}
.names{list-style:none;margin:8px 0 0;padding:6px;max-height:300px;overflow:auto;border:2px solid #E6E6F3;border-radius:14px;background:#fff}
.names li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px}
.names li:hover{background:var(--gy)}
.names li[aria-selected=true]{background:var(--pu);color:#fff;font-weight:700}
.names li .av{width:30px;height:30px;border-radius:50%;background:var(--lgr);display:grid;place-items:center;font-size:14px;color:var(--pu);flex:none;font-weight:700}
.names li[aria-selected=true] .av{background:#fff}
.names .none{color:var(--ink2);cursor:default}
.note{font-size:14px;color:var(--ink2);background:var(--gy);border-radius:12px;padding:10px 14px}
.note.ye{background:var(--ye);border:1px solid var(--gold)}
.note.pk{background:var(--pk)}

/* journey */
.greet{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.greet .art{width:150px;flex:none}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 6px;list-style:none;padding:0}
.track li{text-align:center;font-size:13px;font-weight:700;color:var(--ink2)}
.track .dot{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 4px;border-radius:50%;background:var(--gy);color:var(--ink2);font-size:17px;border:3px solid #fff;box-shadow:0 0 0 2px var(--gy)}
.track li.done .dot{background:var(--gr);color:var(--ok);box-shadow:0 0 0 2px var(--gr)}
.track li.cur .dot{background:var(--tq);color:#fff;box-shadow:0 0 0 3px var(--tq)}
.bar{height:14px;background:var(--gy);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--pu));border-radius:999px;transition:width .6s}
.stations{display:grid;gap:14px;margin-top:18px}
.st{display:flex;gap:16px;align-items:center;background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border:2px solid transparent;text-align:right;width:100%}
.st:hover{border-color:var(--tq)}
.st .art{width:110px;flex:none;border-radius:16px;overflow:hidden}
.st .n{font-size:13px;color:var(--tq-d);font-weight:700}
.st h3{margin:0 0 2px}
.st p{margin:0;font-size:15px;color:var(--ink2)}
.st .stat{margin-inline-start:auto;flex:none;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--gy);color:var(--ink2);white-space:nowrap}
.st .stat.ok{background:var(--lgr);color:var(--ok)}
.st .stat.go{background:var(--ye);color:#8A6A12}
@media (max-width:560px){.st{flex-wrap:wrap}.st .art{width:84px}.st .stat{margin-inline-start:0}}

.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--pk);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--pu-d)}
.badge.off{background:var(--gy);color:#9A9AB5;font-weight:400}

/* pages */
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pagehead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pagehead .art{width:120px;flex:none}
.art svg{width:100%;height:auto;display:block}
.artbox{background:var(--lgr);border-radius:18px;overflow:hidden}

.slide{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:center}
@media (max-width:760px){.slide{grid-template-columns:1fr}}
.slide .artbox{aspect-ratio:16/10}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--gy)}
.dots span.on{background:var(--pu);width:28px;border-radius:8px}

.rights{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:2px solid transparent;text-align:right;padding:0;display:flex;flex-direction:column}
.rcard:hover{border-color:var(--tq)}
.rcard .artbox{border-radius:0;aspect-ratio:16/10}
.rcard .b{padding:12px 16px 16px}
.rcard h3{margin:0 0 4px;font-size:19px}
.rcard .s{font-size:14px;font-weight:700}
.rcard .s.ok{color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,30,70,.45);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:24px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto 0;position:relative}
.modal .x{position:absolute;left:14px;top:14px}

/* activity common */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.wcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:2px solid transparent;padding:0;text-align:right;display:flex;flex-direction:column}
.wcard:hover{border-color:var(--tq)}
.wcard .artbox{border-radius:0;aspect-ratio:16/10}
.wcard .b{padding:12px 16px 16px}
.wcard h3{margin:0;font-size:19px}
.wcard .fr{font-size:13px;color:var(--ink2)}
.prog{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:14px;font-weight:700}
.pill{padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--gy);color:var(--ink2)}
.pill.ok{background:var(--lgr);color:var(--ok)}
.pill.core{background:var(--ye);color:#8A6A12}
.pill.ex{background:var(--pk);color:var(--pu-d)}

.acts{display:grid;gap:12px}
.act{display:flex;gap:14px;align-items:center;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;border:2px solid transparent;text-align:right;width:100%}
.act:hover{border-color:var(--tq)}
.act .ic{width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;background:var(--lgr);font-size:28px}
.act h3{margin:0;font-size:18px}
.act p{margin:0;font-size:14px;color:var(--ink2)}
.act .pills{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.actwrap{max-width:860px;margin:auto}
.inst{background:var(--ye);border:2px solid var(--gold);border-radius:16px;padding:10px 16px;font-size:17px;margin-bottom:14px}
.q{font-size:20px;font-weight:700;margin:6px 0 12px;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #DCDCEF;border-radius:16px;min-height:56px;padding:8px 14px;text-align:right;font-size:17px;width:100%}
.opt .L{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--gy);font-weight:800;color:var(--pu);font-family:"Playpen Sans Arabic",Arial,sans-serif;direction:ltr}
.opt:hover{border-color:var(--tq)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:#E6B7C9;background:var(--nobg);opacity:.85}
.opt[aria-pressed=true]{border-color:var(--pu);background:#F2F2FC}
.fb{border-radius:16px;padding:12px 16px;margin:12px 0;font-size:17px;display:none}
.fb.on{display:block}
.fb.ok{background:var(--okbg);border:2px solid var(--gr)}
.fb.no{background:var(--nobg);border:2px solid #F2CFDD}
.fb b{display:block}
.qcount{font-size:14px;color:var(--ink2);font-weight:700}
.scene{border-radius:18px;overflow:hidden;background:var(--lgr);margin-bottom:12px;max-width:520px}

/* sorter */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:12px;border:2px dashed #CFCFE8;border-radius:16px;background:#FCFCFF;margin-bottom:12px}
.item{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #DCDCEF;border-radius:14px;padding:8px 12px;min-height:48px;font-size:16px;text-align:right;touch-action:none;user-select:none}
.item[aria-pressed=true]{border-color:var(--pu);background:#EFEFFC;box-shadow:0 0 0 3px rgba(84,84,175,.2)}
.item.okk{border-color:var(--ok);background:var(--okbg)}
.item .em{font-size:22px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bin{border-radius:18px;padding:10px;min-height:150px;border:3px solid transparent;display:flex;flex-direction:column;gap:8px;text-align:right;width:100%}
.bin .bh{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;text-align:right;width:100%;color:var(--ink);min-height:44px}
.bin.over{border-color:var(--tq)}
.bin .list{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:14px;color:var(--ink2)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match .col{display:grid;gap:10px;align-content:start}
.mi{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #DCDCEF;border-radius:14px;min-height:56px;padding:8px 12px;font-size:16px;text-align:right;width:100%}
.mi .em{font-size:26px}
.mi[aria-pressed=true]{border-color:var(--pu);background:#EFEFFC}
.mi .tag{margin-inline-start:auto;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
.mi.okk{border-color:var(--ok);background:var(--okbg)}

/* order */
.olist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.olist li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #DCDCEF;border-radius:14px;padding:8px 10px;min-height:56px}
.olist li .num{width:32px;height:32px;border-radius:50%;background:var(--gy);display:grid;place-items:center;font-weight:800;color:var(--pu);flex:none}
.olist li .tx{flex:1}
.olist li.okk{border-color:var(--ok);background:var(--okbg)}
.olist li.dragging{opacity:.5}
.mv{width:44px;height:44px;border-radius:12px;border:2px solid var(--gy);background:#fff;font-size:18px;color:var(--pu)}

/* pick */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pick{background:#fff;border:3px solid #E3E3F2;border-radius:18px;overflow:hidden;padding:0;text-align:right;display:flex;flex-direction:column}
.pick .artbox{border-radius:0;aspect-ratio:16/10}
.pick .t{padding:10px 12px;font-size:16px;display:flex;gap:8px;align-items:flex-start}
.pick .t .L{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--gy);font-weight:800;color:var(--pu);direction:ltr}
.pick[aria-pressed=true]{border-color:var(--pu);box-shadow:0 0 0 3px rgba(84,84,175,.18)}
.pick[aria-pressed=true] .t .L{background:var(--pu);color:#fff}
.pick.okk{border-color:var(--ok)}
.pick.small .t{font-size:15px}
.pick .ico{font-size:40px;text-align:center;padding:14px 0 0}

/* draw */
.drawwrap{background:#fff;border-radius:18px;border:2px solid #E3E3F2;padding:10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #D8D8EE}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--pu)}
canvas.pad{width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:12px;border:2px dashed #D8D8EE;touch-action:none;display:block;cursor:crosshair}
.board{width:100%;aspect-ratio:4/3;background:#FCFCFF;border:2px dashed #D8D8EE;border-radius:12px;touch-action:none;display:block}

/* coins */
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:center}
.meter{height:26px;background:var(--gy);border-radius:999px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#F2C76B,#E0A93A);transition:width .5s}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.coins{font-size:26px;letter-spacing:2px}

/* idea card */
.ideacard{border-radius:22px;padding:20px;color:var(--ink);border:3px solid var(--pu);background:var(--ye);position:relative;overflow:hidden;min-height:220px}
.ideacard h3{font-size:24px}

/* faces */
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.face{background:#fff;border:3px solid #E3E3F2;border-radius:18px;padding:8px;text-align:center;font-size:16px;font-weight:700}
.face svg{width:70px;height:70px;margin:auto;display:block}
.face[aria-pressed=true]{border-color:var(--pu);background:#F2F2FC}
textarea.inp{min-height:90px;resize:vertical}

/* timer */
.timer{font-size:46px;font-weight:800;color:var(--pu);text-align:center;direction:ltr}

/* done banner */
.donebox{text-align:center;background:linear-gradient(160deg,var(--lgr),#fff);border:2px solid var(--gr);border-radius:22px;padding:18px;margin-top:14px}
.donebox .big{font-size:22px;font-weight:800;color:var(--ok)}
.star{display:inline-block;color:#E3A82B;font-size:26px}

/* cert */
.certprev{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px;border:1px solid #EEE}
.certprev img{width:100%;height:auto;border-radius:8px}
.miss li{margin:6px 0}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--gy);text-align:right;vertical-align:middle}
.tbl th{background:var(--pu);color:#fff;position:sticky;top:0}
.tbl tr:nth-child(even) td{background:#FAFAFE}
.twrap{overflow:auto;max-height:60vh;border-radius:14px;border:1px solid var(--gy)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{min-height:44px;padding:6px 16px;border-radius:12px;border:2px solid var(--gy);background:#fff;font-weight:700;color:var(--pu)}
.tab[aria-selected=true]{background:var(--pu);color:#fff;border-color:var(--pu)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kv div{background:var(--lgr);border-radius:14px;padding:10px;text-align:center}
.kv b{display:block;font-size:26px;color:var(--pu)}

footer{background:var(--pu);color:#fff;text-align:center;padding:22px 14px 26px;margin-top:30px;font-size:15px;line-height:1.9}
footer b{font-size:17px}
footer .tbtn{margin-top:10px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:6px 14px;min-height:40px;font-size:14px}

.toast{visibility:hidden;position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:80;transition:transform .3s;max-width:92vw;text-align:center}
.toast.on{visibility:visible;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
.tts{background:#fff;border:2px solid var(--gy);border-radius:12px;min-height:40px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--tq-d)}
.hide{display:none!important}

#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;width:297mm;height:210mm;overflow:hidden}
  #printArea img{width:297mm;height:210mm;object-fit:contain}
  html,body{background:#fff;margin:0}
}
</style>
</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<header class="top">
  <div class="top-in">
    <button class="brand" id="homeBtn" aria-label="الصفحة الرئيسة للرحلة">
      <img id="hdrLogo" alt="شعار يوم الطفل" width="72" height="46">
      <span class="bt">الاحتفاء باليوم العالمي للطفل<small>المدرسة المركزية للبنين بحائل</small></span>
    </button>
    <span class="top-sp"></span>
    <div class="who hide" id="who">
      <span class="chip" id="starChip" title="نجومك"><span aria-hidden="true">★</span> <span id="starN">0</span><span class="sr"> نجمة</span></span>
      <span class="nm">أهلًا يا <b id="whoName"></b></span>
      <button class="iconbtn" id="switchBtn">تغيير الطالب</button>
    </div>
    <button class="iconbtn" id="motionBtn" aria-pressed="false" title="تقليل الحركة">تقليل الحركة</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<div class="sr" aria-live="polite" id="live"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>
<footer>
  <b>المدرسة المركزية للبنين بحائل</b><br>
  إعداد المعلم / محمد هليل الشمري<br>
  مدير المدرسة / طلال خليف الشمري
  <div><button class="tbtn" id="teacherBtn">لوحة المعلم</button></div>

<script>
/* ===== رسومات توضيحية (SVG) ===== */
const C={tq:'#36B0CC',pu:'#5454AF',gold:'#F7E3B5',gr:'#B7E5B7',lgr:'#E8F8EE',pk:'#F9E8F7',ye:'#FFF8E8',gy:'#EEEFF2'};
const SK=['#F3CDB0','#E2B08C','#C99069','#F6D9C4'];
function face(x,y,r,m){ // eyes + mouth
  const e=r*.32, ey=y-r*.12;
  let mouth='';
  if(m==='sad') mouth=`<path d="M${x-r*.32} ${y+r*.42} q${r*.32} -${r*.28} ${r*.64} 0" fill="none" stroke="${C.pu}" stroke-width="${r*.11}" stroke-linecap="round"/>`;
  else if(m==='wow') mouth=`<ellipse cx="${x}" cy="${y+r*.36}" rx="${r*.14}" ry="${r*.18}" fill="${C.pu}"/>`;
  else if(m==='flat') mouth=`<path d="M${x-r*.28} ${y+r*.36} h${r*.56}" stroke="${C.pu}" stroke-width="${r*.11}" stroke-linecap="round"/>`;
  else mouth=`<path d="M${x-r*.38} ${y+r*.2} q${r*.38} ${r*.42} ${r*.76} 0" fill="${C.pu}" stroke="${C.pu}" stroke-width="${r*.08}" stroke-linejoin="round"/>`;
  return `<circle cx="${x-e}" cy="${ey}" r="${r*.1}" fill="${C.pu}"/><circle cx="${x+e}" cy="${ey}" r="${r*.1}" fill="${C.pu}"/>${mouth}`;
}
/* طفل: x,y = موضع القدمين */
function kid(x,y,o={}){
  const s=o.s||1, sk=SK[o.sk||0], g=o.g, cl=o.c||(g?'#F4B6D8':'#FFFFFF'), r=20*s;
  const hx=x, hy=y-78*s;
  const body=`<path d="M${x-20*s} ${y-52*s} Q${x} ${y-62*s} ${x+20*s} ${y-52*s} L${x+24*s} ${y-6*s} Q${x} ${y} ${x-24*s} ${y-6*s} Z" fill="${cl}" stroke="${C.pu}" stroke-width="${2.2*s}" stroke-linejoin="round"/>`;
  const legs=`<path d="M${x-8*s} ${y-4*s} v${8*s} M${x+8*s} ${y-4*s} v${8*s}" stroke="${C.pu}" stroke-width="${4*s}" stroke-linecap="round"/>`;
  let arms='';
  const a=o.arm||'down';
  if(a==='up') arms=`<path d="M${x-19*s} ${y-46*s} l-${14*s} -${24*s} M${x+19*s} ${y-46*s} l${14*s} -${24*s}" stroke="${sk}" stroke-width="${7*s}" stroke-linecap="round"/>`;
  else if(a==='wave') arms=`<path d="M${x-19*s} ${y-46*s} l-${12*s} ${22*s} M${x+19*s} ${y-46*s} l${16*s} -${22*s}" stroke="${sk}" stroke-width="${7*s}" stroke-linecap="round"/>`;
  else if(a==='hold') arms=`<path d="M${x-19*s} ${y-46*s} q-${4*s} ${16*s} ${8*s} ${20*s} M${x+19*s} ${y-46*s} q${4*s} ${16*s} -${8*s} ${20*s}" stroke="${sk}" stroke-width="${7*s}" stroke-linecap="round" fill="none"/>`;
  else if(a==='side') arms=`<path d="M${x-19*s} ${y-46*s} l-${20*s} ${6*s} M${x+19*s} ${y-46*s} l${20*s} ${6*s}" stroke="${sk}" stroke-width="${7*s}" stroke-linecap="round"/>`;
  else arms=`<path d="M${x-19*s} ${y-46*s} l-${8*s} ${24*s} M${x+19*s} ${y-46*s} l${8*s} ${24*s}" stroke="${sk}" stroke-width="${7*s}" stroke-linecap="round"/>`;
  let hair='';
  if(g){hair=`<path d="M${hx-r} ${hy+2*s} Q${hx-r-4*s} ${hy-r-4*s} ${hx} ${hy-r-2*s} Q${hx+r+4*s} ${hy-r-4*s} ${hx+r} ${hy+2*s} Q${hx+r*.4} ${hy-r*.6} ${hx-r} ${hy+2*s}Z" fill="#4A3426"/><path d="M${hx+r*.5} ${hy-r*.9} l${10*s} -${8*s} l${2*s} ${12*s} Z M${hx+r*.5} ${hy-r*.9} l${12*s} ${2*s} l-${6*s} ${10*s} Z" fill="${C.tq}"/>`;}
  else if(o.cap){hair=`<path d="M${hx-r-2*s} ${hy-2*s} Q${hx} ${hy-r*1.6} ${hx+r+2*s} ${hy-2*s} Z" fill="#fff" stroke="${C.pu}" stroke-width="${2*s}"/>`;}
  else {hair=`<path d="M${hx-r+1} ${hy-4*s} Q${hx} ${hy-r*1.45} ${hx+r-1} ${hy-4*s} Q${hx} ${hy-r*.7} ${hx-r+1} ${hy-4*s}Z" fill="#3B2A20"/>`;}
  const head=`<circle cx="${hx}" cy="${hy}" r="${r}" fill="${sk}" stroke="${C.tq}" stroke-width="${2.6*s}"/>`;
  return `<g>${legs}${arms}${body}${head}${hair}${face(hx,hy+3*s,r,o.m)}</g>`;
}
function adult(x,y,o={}){
  const s=o.s||1.25; return kid(x,y,Object.assign({},o,{s,c:o.c||'#E8F8EE',cap:!o.g}));
}
const svg=(inner,bg=C.lgr,vb='0 0 320 200')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="${bg}"/>${inner}</svg>`;
const ground=(c=C.gr)=>`<path d="M0 165 Q80 150 160 160 T320 158 V200 H0Z" fill="${c}"/>`;
const sun=(x=270,y=36)=>`<circle cx="${x}" cy="${y}" r="16" fill="#F7D985"/>`;
const cloud=(x,y)=>`<g fill="#fff"><circle cx="${x}" cy="${y}" r="10"/><circle cx="${x+12}" cy="${y-5}" r="12"/><circle cx="${x+25}" cy="${y}" r="9"/></g>`;
const loop=(x,y,c=C.tq,s=1)=>`<path d="M${x} ${y} c${12*s} -${18*s} ${30*s} -${8*s} ${18*s} ${6*s} c-${8*s} ${10*s} -${22*s} 0 -${8*s} -${14*s} c${10*s} -${10*s} ${22*s} -${4*s} ${28*s} ${2*s}" fill="none" stroke="${c}" stroke-width="${3*s}" stroke-linecap="round"/>`;
const heart=(x,y,s=1,c='#E77FA8')=>`<path d="M${x} ${y+8*s} C${x-16*s} ${y-4*s} ${x-10*s} ${y-18*s} ${x} ${y-9*s} C${x+10*s} ${y-18*s} ${x+16*s} ${y-4*s} ${x} ${y+8*s}Z" fill="${c}"/>`;
const starS=(x,y,r=10,c='#F2C14E')=>{let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return `<path d="${p}Z" fill="${c}"/>`};
const bubble=(x,y,w,h,t,c='#fff')=>`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${c}" stroke="${C.pu}" stroke-width="2"/><path d="M${x+w*.3} ${y+h} l6 10 l6 -10" fill="${c}" stroke="${C.pu}" stroke-width="2" stroke-linejoin="round"/><rect x="${x+w*.3-1}" y="${y+h-3}" width="14" height="5" fill="${c}"/>${t?`<text x="${x+w/2}" y="${y+h/2+5}" font-size="13" text-anchor="middle" fill="${C.pu}" font-family="Playpen Sans Arabic,Tahoma" font-weight="700">${t}</text>`:''}</g>`;
const book=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 L22 4 L44 0 V30 L22 34 L0 30Z" fill="#fff" stroke="${C.pu}" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 4 V34" stroke="${C.pu}" stroke-width="2"/><path d="M6 10 l10 2 M6 16 l10 2 M28 12 l10 -2 M28 18 l10 -2" stroke="${C.tq}" stroke-width="2"/></g>`;
const ball=(x,y,r=12)=>`<g><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${C.pu}" stroke-width="2.5"/><path d="M${x-r} ${y} Q${x} ${y-r*.6} ${x+r} ${y} M${x} ${y-r} Q${x+r*.5} ${y} ${x} ${y+r}" fill="none" stroke="${C.tq}" stroke-width="2.5"/></g>`;
const shield=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 -26 L22 -18 V2 Q22 20 0 30 Q-22 20 -22 2 V-18Z" fill="${C.tq}" stroke="${C.pu}" stroke-width="3" stroke-linejoin="round"/><path d="M-9 2 l7 8 l13 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`;

/* ===== حالة الإنجاز ===== */
function introDone(s){return s.intro.done;}
function rightsDone(s){return RIGHTS.every(r=>s.rights.done[r.id]);}
function worldCoreDone(s,w){return w.acts.filter(a=>a.core).every(a=>s.acts[a.id]);}
function worldsDoneN(s){return WORLDS.filter(w=>worldCoreDone(s,w)).length;}
function extrasDoneN(s){return WORLDS.flatMap(w=>w.acts.filter(a=>!a.core)).filter(a=>s.acts[a.id]).length;}
function eligible(s){const S=DB.settings,m=[];
  if(S.requireIntro&&!introDone(s))m.push(['intro','أكمل محطة «يوم الطفل وشعاره»']);
  if(S.requireRights&&!rightsDone(s))m.push(['rights','افتح بطاقات «حقوقي» الست وأجب عن أسئلتها']);
  const need=Math.min(8,Math.max(1,+S.worldsRequired||8)),have=worldsDoneN(s);
  if(have<need)m.push(['worlds',need===8?`أكمل النشاط الأساسي في كل عالم من العوالم الثمانية (أنجزت ${have} من 8)`:`أكمل النشاط الأساسي في ${need} عوالم على الأقل (أنجزت ${have})`]);
  return {ok:!m.length,missing:m};}
function stationState(s){
  const e=eligible(s);
  return [introDone(s),rightsDone(s),worldsDoneN(s)>=Math.min(8,+DB.settings.worldsRequired||8),Object.values(s.family).some(Boolean),e.ok&&!!s.certAt];
}
function pct(s){const need=Math.min(8,+DB.settings.worldsRequired||8);const tot=(DB.settings.requireIntro?1:0)+(DB.settings.requireRights?6:0)+need;let d=(DB.settings.requireIntro&&introDone(s)?1:0)+(DB.settings.requireRights?RIGHTS.filter(r=>s.rights.done[r.id]).length:0)+Math.min(need,worldsDoneN(s));return Math.round(d/tot*100);}
function addStar(n=1){const s=stu();s.stars+=n;save();$('#starN').textContent=s.stars;}

/* مطابقة */
function matcher(el,{left,right,inst},onDone){
  const L=shuffle(left),R=shuffle(right);const pairs={};let sl=null,done=false;const cols=[C.tq,C.pu,'#E07BB3','#D9A21B','#2E8B57','#C0563F','#6A7BD6'];
  el.innerHTML=`<p class="hint">${inst||'اضغط على عنصر من العمود الأيمن، ثم اضغط على ما يناسبه في العمود الأيسر.'}</p><div class="match"><div class="col" data-c="l"></div><div class="col" data-c="r"></div></div><div class="row end" style="margin-top:12px"><button class="btn" data-chk>تحقق</button></div>`;
  const f=fbBox(el);
  function tagOf(id){const ks=Object.keys(pairs);const k=ks.indexOf(id);return k}
  function draw(){
    $('[data-c=l]',el).innerHTML=L.map(x=>{const k=tagOf(x.id);return `<button class="mi ${x.ok?'okk':''}" data-l="${x.id}" aria-pressed="${sl===x.id}">${x.e?`<span class="em" aria-hidden="true">${x.e}</span>`:''}${x.t}${k>-1?`<span class="tag" style="background:${cols[k%cols.length]}">${k+1}</span>`:''}</button>`}).join('');
    $('[data-c=r]',el).innerHTML=R.map(x=>{const lid=Object.keys(pairs).find(k=>pairs[k]===x.id);const k=lid?tagOf(lid):-1;return `<button class="mi ${x.ok?'okk':''}" data-r="${x.id}">${x.e?`<span class="em" aria-hidden="true">${x.e}</span>`:''}${x.t}${k>-1?`<span class="tag" style="background:${cols[k%cols.length]}">${k+1}</span>`:''}</button>`}).join('');
  }
  el.addEventListener('click',e=>{if(done)return;const l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]');
    if(l){const x=L.find(y=>y.id===l.dataset.l);if(x.ok)return;sl=sl===x.id?null:x.id;draw();if(sl)say('اخترت '+x.t+'. اختر ما يناسبه.');}
    if(r&&sl){const rx=R.find(y=>y.id===r.dataset.r);if(rx.ok)return;Object.keys(pairs).forEach(k=>{if(pairs[k]===rx.id)delete pairs[k];});pairs[sl]=rx.id;sl=null;draw();}
  });
  $('[data-chk]',el).onclick=()=>{if(done)return;if(Object.keys(pairs).length<L.length){showFb(f,false,`<b>لم تكمل المطابقة.</b>صِل كل عنصر بما يناسبه ثم اضغط «تحقق».`);return;}
    let w=0;Object.keys(pairs).forEach(k=>{if(pairs[k]===k){L.find(x=>x.id===k).ok=1;R.find(x=>x.id===k).ok=1;}else{delete pairs[k];w++;}});draw();
    if(w)showFb(f,false,`<b>${L.length-w} صحيحة!</b>أزلنا ${w} من الروابط غير المناسبة، حاول مرة أخرى.`);else{done=true;$('[data-chk]',el).disabled=true;showFb(f,true,'<b>مطابقة ممتازة!</b>');onDone&&onDone();}
  };
  draw();
}
/* ترتيب */
function orderer(el,{items,inst},onDone){
  let o=shuffle(items.map((t,i)=>({t,i})));if(o.every((x,k)=>x.i===k))o.reverse();let done=false;
  el.innerHTML=`<p class="hint">${inst||'رتّب البطاقات باستخدام الأسهم ↑ ↓، أو اسحبها.'}</p><ol class="olist"></ol><div class="row end" style="margin-top:12px"><button class="btn" data-chk>تحقق</button></div>`;
  const f=fbBox(el),ol=$('.olist',el);let drag=null;
  function draw(fm){ol.innerHTML=o.map((x,k)=>`<li draggable="true" data-k="${k}" class="${x.ok?'okk':''}"><span class="num">${k+1}</span><span class="tx">${x.t}</span><button class="mv" data-up="${k}" aria-label="انقل «${esc(x.t)}» للأعلى" ${k===0?'disabled':''}>↑</button><button class="mv" data-dn="${k}" aria-label="انقل «${esc(x.t)}» للأسفل" ${k===o.length-1?'disabled':''}>↓</button></li>`).join('');if(fm!=null){const b=$(fm,ol);b&&b.focus();}}
  ol.addEventListener('click',e=>{if(done)return;const u=e.target.closest('[data-up]'),d=e.target.closest('[data-dn]');o.forEach(x=>x.ok=0);
    if(u){const k=+u.dataset.up;[o[k-1],o[k]]=[o[k],o[k-1]];draw(`[data-up="${k-1}"]`)||0;}
    if(d){const k=+d.dataset.dn;[o[k+1],o[k]]=[o[k],o[k+1]];draw(`[data-dn="${k+1}"]`);}});
  ol.addEventListener('dragstart',e=>{const li=e.target.closest('li');if(li){drag=+li.dataset.k;li.classList.add('dragging');}});
  ol.addEventListener('dragover',e=>e.preventDefault());
  ol.addEventListener('drop',e=>{e.preventDefault();const li=e.target.closest('li');if(li==null||drag==null||done)return;const to=+li.dataset.k;const [m]=o.splice(drag,1);o.splice(to,0,m);drag=null;o.forEach(x=>x.ok=0);draw();});
  $('[data-chk]',el).onclick=()=>{if(done)return;let r=0;o.forEach((x,k)=>{x.ok=x.i===k;if(x.ok)r++;});draw();
    if(r<o.length)showFb(f,false,`<b>${r} من ${o.length} في مكانها الصحيح.</b>البطاقات الخضراء صحيحة، رتّب البقية وحاول مجددًا.`);else{done=true;$('[data-chk]',el).disabled=true;showFb(f,true,'<b>ترتيب رائع!</b>');onDone&&onDone();}};
  draw();
}

function multiPick(el,{items,inst,ex},onDone){

    done=true;its.forEach((x,k)=>{if(x.ok)$$('.pick',el)[k].classList.add('okk')});$('[data-chk]',el).disabled=true;showFb(f,true,`<b>أحسنت!</b>${ex||''}`);onDone&&onDone();};
}

function choiceAct(el,{q,items,write,msg},done){
  let v=null;
  el.innerHTML=`<p class="q">${q}</p><div class="picks">${items.map(([e,t],k)=>`<button class="pick small" data-k="${k}" aria-pressed="false"><div class="ico" aria-hidden="true">${e}</div><span class="t"><span class="L">${LET[k]||k+1}</span><span>${t}</span></span></button>`).join('')}</div>
  <div class="field"><label for="optTxt">${write}</label><textarea id="optTxt" class="inp" maxlength="200" placeholder="مثال: أحلم أن أصمّم لعبة تعليمية"></textarea><p class="hint">ما تكتبه يبقى على جهازك ولا يُنشر لأحد.</p></div>
  <div class="row end"><button class="btn" data-ok disabled>أنهيت</button></div>`;
  const f=fbBox(el);
  el.addEventListener('click',e=>{const p=e.target.closest('.pick');if(!p)return;$$('.pick',el).forEach(x=>x.setAttribute('aria-pressed','false'));p.setAttribute('aria-pressed','true');v=items[+p.dataset.k][1];$('[data-ok]',el).disabled=false;});
  $('[data-ok]',el).onclick=()=>{$('[data-ok]',el).disabled=true;showFb(f,true,`<b>${msg(v)}</b>`);done();};
}
function drawPad(el,done){
  const cols=['#2E2E6E','#5454AF','#36B0CC','#2E8B57','#7CC77C','#F2C14E','#F2A541','#E86A6A','#E07BB3','#9B6B43','#FFFFFF'];
  el.innerHTML=`<div class="drawwrap"><div class="tools" role="toolbar" aria-label="أدوات الرسم">${cols.map((c,k)=>`<button class="sw" style="background:${c}" data-c="${c}" aria-label="${c==='#FFFFFF'?'ممحاة (أبيض)':'لون '+(k+1)}" aria-pressed="${k===2}"></button>`).join('')}
   <label class="hint">السُّمك <input type="range" min="3" max="40" value="10" data-w aria-label="سمك الفرشاة"></label>
   <button class="iconbtn" data-undo>تراجع</button><button class="iconbtn" data-clear>مسح الكل</button>
   <button class="iconbtn" data-stamp="sun">☀️ شمس</button><button class="iconbtn" data-stamp="heart">❤️ قلب</button><button class="iconbtn" data-stamp="star">⭐ نجمة</button></div>
   <canvas class="pad" width="1200" height="900" aria-label="لوحة الرسم: طفولتي السعيدة"></canvas>
   <p class="hint">ارسم بإصبعك أو بالفأرة. لإضافة شكل جاهز: اضغط على زر الشكل ثم اضغط في اللوحة.</p></div>
   <div class="row end" style="margin-top:10px"><button class="btn soft sm" data-save>حفظ لوحتي صورة</button><button class="btn" data-fin>أنهيت لوحتي</button></div>`;
  const cv=$('canvas',el),ctx=cv.getContext('2d');let col='#36B0CC',w=10,drawing=false,stamp=null,hist=[],strokes=0;
  const key='draw_'+DB.current;
  function bg(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#5454AF';ctx.font='700 40px "Playpen Sans Arabic",Tahoma';ctx.textAlign='center';ctx.direction='rtl';ctx.fillText('طفولتي السعيدة',600,60);}
  bg();
  try{const d=localStorage.getItem(key);if(d){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);strokes=1;};im.src=d;}}catch(e){}
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  function snap(){try{hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>15)hist.shift();}catch(e){}}
  function persist(){try{localStorage.setItem(key,cv.toDataURL('image/jpeg',.7));}catch(e){}}
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);snap();const [x,y]=pos(e);
    if(stamp){ctx.save();ctx.font='120px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({sun:'☀️',heart:'❤️',star:'⭐'}[stamp],x,y);ctx.restore();stamp=null;strokes++;persist();$$('[data-stamp]',el).forEach(b=>b.style.borderColor='');return;}
    drawing=true;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();});
  const end=()=>{if(drawing){drawing=false;strokes++;persist();}};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  el.addEventListener('click',e=>{const s=e.target.closest('.sw');if(s){col=s.dataset.c;$$('.sw',el).forEach(x=>x.setAttribute('aria-pressed',x===s));}
    const st=e.target.closest('[data-stamp]');if(st){stamp=st.dataset.stamp;$$('[data-stamp]',el).forEach(b=>b.style.borderColor='');st.style.borderColor=C.pu;toast('اضغط في اللوحة لوضع الشكل');}});
  $('[data-w]',el).oninput=e=>w=+e.target.value;
  $('[data-undo]',el).onclick=()=>{const h=hist.pop();if(h){ctx.putImageData(h,0,0);persist();}};
  $('[data-clear]',el).onclick=()=>{snap();bg();strokes=0;try{localStorage.removeItem(key)}catch(e){}};
  $('[data-save]',el).onclick=()=>cv.toBlob(b=>saveFile(b,'طفولتي-السعيدة.png'),'image/png');
  const f=fbBox(el);
  $('[data-fin]',el).onclick=()=>{if(!strokes){showFb(f,false,'<b>لوحتك فارغة.</b>ارسم شيئًا يجعلك سعيدًا ثم اضغط «أنهيت لوحتي».');return;}showFb(f,true,'<b>لوحة رائعة يا فنان!</b>يمكنك حفظها صورة. لوحتك تبقى على جهازك ولا تُنشر.');done();};
}
function shapeBuilder(el,done){
  const SH={circle:'دائرة',square:'مربع',tri:'مثلث',rect:'مستطيل',wheel:'عجلة',star:'نجمة'};const cols=[C.tq,C.pu,'#F2C14E','#E86A6A','#7CC77C','#E07BB3'];
  let items=[],sel=null,ci=0;
  el.innerHTML=`<div class="drawwrap"><div class="tools">${Object.entries(SH).map(([k,t])=>`<button class="iconbtn" data-add="${k}">+ ${t}</button>`).join('')}</div>
  <svg class="board" viewBox="0 0 400 300" aria-label="لوحة الابتكار"></svg>
  <div class="tools" style="margin-top:8px" aria-label="تحريك الشكل المختار"><span class="hint">الشكل المختار:</span>
   <button class="mv" data-m="0,-12" aria-label="أعلى">↑</button><button class="mv" data-m="0,12" aria-label="أسفل">↓</button><button class="mv" data-m="12,0" aria-label="يمين">→</button><button class="mv" data-m="-12,0" aria-label="يسار">←</button>
   <button class="mv" data-z="1.15" aria-label="تكبير">+</button><button class="mv" data-z=".87" aria-label="تصغير">−</button><button class="iconbtn" data-col>تغيير اللون</button><button class="iconbtn" data-del>حذف</button></div>
  <p class="hint">اضغط على الشكل لاختياره، واسحبه أو حرّكه بالأزرار.</p></div>
  <div class="field"><label for="invName">اسم اختراعي</label><input id="invName" class="inp" maxlength="40" placeholder="مثال: سيارة تنظّف الشارع"></div>
  <div class="row end"><button class="btn soft sm" data-save>حفظ ابتكاري صورة</button><button class="btn" data-fin>أنهيت ابتكاري</button></div>`;
  const B=$('svg.board',el),f=fbBox(el);
  function shp(it){const c=it.c,s=it.s,p=`stroke="${C.pu}" stroke-width="3"`;
    if(it.k==='circle')return `<circle r="${30*s}" fill="${c}" ${p}/>`;
    if(it.k==='square')return `<rect x="${-28*s}" y="${-28*s}" width="${56*s}" height="${56*s}" rx="6" fill="${c}" ${p}/>`;
    if(it.k==='rect')return `<rect x="${-50*s}" y="${-20*s}" width="${100*s}" height="${40*s}" rx="8" fill="${c}" ${p}/>`;
    if(it.k==='tri')return `<path d="M0 ${-34*s} L${32*s} ${26*s} L${-32*s} ${26*s}Z" fill="${c}" ${p} stroke-linejoin="round"/>`;
    if(it.k==='wheel')return `<circle r="${22*s}" fill="#444" ${p}/><circle r="${9*s}" fill="#ddd"/>`;
    let d='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=(i%2?14:32)*s;d+=(i?'L':'M')+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1);}return `<path d="${d}Z" fill="${c}" ${p}/>`;}
  function draw(){B.innerHTML=`<rect width="400" height="300" fill="#FCFCFF"/>`+items.map((it,i)=>`<g transform="translate(${it.x} ${it.y})" data-i="${i}" style="cursor:grab" ${sel===i?`filter="drop-shadow(0 0 4px ${C.pu})"`:''}>${shp(it)}</g>`).join('');}
  el.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a){items.push({k:a.dataset.add,x:120+Math.random()*160,y:90+Math.random()*120,s:1,c:cols[ci++%cols.length]});sel=items.length-1;draw();}
    const m=e.target.closest('[data-m]');if(m&&sel!=null){const [dx,dy]=m.dataset.m.split(',').map(Number);items[sel].x+=dx;items[sel].y+=dy;draw();}
    const z=e.target.closest('[data-z]');if(z&&sel!=null){items[sel].s=Math.max(.4,Math.min(3,items[sel].s*+z.dataset.z));draw();}
    if(e.target.closest('[data-col]')&&sel!=null){items[sel].c=cols[(cols.indexOf(items[sel].c)+1)%cols.length];draw();}
    if(e.target.closest('[data-del]')&&sel!=null){items.splice(sel,1);sel=null;draw();}});
  let dg=null;const pt=e=>{const r=B.getBoundingClientRect();return [(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*300/r.height];};
  B.addEventListener('pointerdown',e=>{const g=e.target.closest('g[data-i]');if(!g){sel=null;draw();return;}sel=+g.dataset.i;const [x,y]=pt(e);dg={dx:x-items[sel].x,dy:y-items[sel].y};B.setPointerCapture(e.pointerId);draw();});
  B.addEventListener('pointermove',e=>{if(!dg||sel==null)return;const [x,y]=pt(e);items[sel].x=x-dg.dx;items[sel].y=y-dg.dy;draw();});
  B.addEventListener('pointerup',()=>dg=null);
  $('[data-save]',el).onclick=()=>{if(!items.length){toast('أضف أشكالًا أولًا');return;}const nm=$('#invName').value.trim();const sv=new XMLSerializer().serializeToString(B);const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=980;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,980);x.drawImage(img,0,80,1200,900);x.fillStyle=C.pu;x.font='700 46px "Playpen Sans Arabic",Tahoma';x.textAlign='center';x.direction='rtl';x.fillText(nm||'ابتكاري الصغير',600,58);c.toBlob(b=>saveFile(b,'ابتكاري.png'),'image/png');};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sv.includes('xmlns')?sv:sv.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"'));};
  $('[data-fin]',el).onclick=()=>{if(items.length<3){showFb(f,false,`<b>أضف ${3-items.length} أشكال أخرى.</b>`);return;}if(!$('#invName').value.trim()){showFb(f,false,'<b>سمِّ اختراعك.</b>اكتب اسمًا قصيرًا في خانة «اسم اختراعي».');return;}showFb(f,true,`<b>ابتكار رائع: «${esc($('#invName').value.trim())}»!</b>كل اختراع كبير يبدأ بفكرة صغيرة.`);done();};
  draw();
}
function savingsGame(el,done){
  let wk=0,saved=0,ate=0;const goal=15,weeks=4;
  function ui(msg){

/* ملف PDF من صورة JPEG — صفحة A4 أفقية واحدة */
function jpegPdf(jpg,pw,ph){
  const W=841.89,H=595.28,enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push('\nendobj\n');};
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream');});
  const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  const x=len;let t=`xref\n0 6\n0000000000 65535 f \n`;for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(t+`trailer\n<< /Size 6 /Root 1 0 R /Info << /Title (Certificate) /Producer (Childrens Day) >> >>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

async function drawCert(name,s){
  const W=3508,H=2480,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');

  x.lineWidth=26;x.strokeStyle='#5454AF';rr(70,70,W-140,H-140,70);x.stroke();
  x.lineWidth=8;x.strokeStyle='#36B0CC';rr(120,120,W-240,H-240,50);x.stroke();
  x.direction='rtl';x.textBaseline='alphabetic';
  // ترويسة يمين
  x.textAlign='right';x.fillStyle='#2E2E6E';
  ['المملكة العربية السعودية','وزارة التعليم','الإدارة العامة للتعليم بمنطقة حائل','المدرسة المركزية للبنين بحائل'].forEach((t,i)=>{x.font=`${i===3?700:400} ${i===3?62:56}px ${F}`;x.fillText(t,W-230,300+i*86);});
  // شعار يوم الطفل يسار، وشعار الوزارة في الوسط
  if(logo){const lw=560,lh=lw*logo.height/logo.width;x.drawImage(logo,230,210,lw,lh);}
  if(moe){const mw=330,mh=mw*moe.height/moe.width;x.drawImage(moe,W/2-mw/2,200,mw,mh);}
  // العنوان
  x.textAlign='center';x.fillStyle='#5454AF';x.font=`800 190px ${F}`;x.fillText('شهادة مشاركة',W/2,800);
  // شعار نحن أمانة
  x.font=`700 70px ${F}`;const sl='نحن أمانة',sw=x.measureText(sl).width+110;x.fillStyle='#36B0CC';rr(W/2-sw/2,850,sw,110,55);x.fill();x.fillStyle='#fff';x.fillText(sl,W/2,930);
  // النص
  x.fillStyle='#2E2E6E';x.font=`400 66px ${F}`;x.fillText('تُقدّم المدرسة المركزية للبنين بحائل هذه الشهادة للطالب',W/2,1100);
  // الاسم
  let fs=170;x.font=`800 ${fs}px ${F}`;while(x.measureText(name).width>W-700&&fs>90){fs-=6;x.font=`800 ${fs}px ${F}`;}
  x.fillStyle='#5454AF';x.fillText(name,W/2,1100+fs+40);
  const nw=Math.min(x.measureText(name).width+120,W-600);x.strokeStyle='#F7E3B5';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(W/2-nw/2,1100+fs+80);x.lineTo(W/2+nw/2,1100+fs+80);x.stroke();
  let by=1100+fs+190;
  if(s.school){x.fillStyle='#2E2E6E';x.font=`700 70px ${F}`;x.fillText('من مدرسة '+s.school,W/2,by);by+=135;}
  const body='تقديرًا لمشاركته الفاعلة في أنشطة الاحتفاء باليوم العالمي للطفل تحت شعار «نحن أمانة»، وتفاعله مع الأنشطة التعليمية المعززة لحقوق الطفل وقيم الاحترام والتعاون والإبداع.';
  x.fillStyle='#2E2E6E';x.font=`400 62px ${F}`;
  const words=body.split(' '),lines=[];let ln='';const maxW=W-760;words.forEach(w=>{const t=ln?ln+' '+w:w;if(x.measureText(t).width>maxW&&ln){lines.push(ln);ln=w;}else ln=t;});if(ln)lines.push(ln);
  let y=by;lines.forEach(l=>{x.fillText(l,W/2,y);y+=96;});
  const d=s.certAt||today();
  x.font=`400 56px ${F}`;x.fillStyle='#4B4B78';x.fillText(`تاريخ المشاركة: ${fmtDate(d)} — الموافق ${fmtDate(d,'h')}`,W/2,y+30);
  // التذييل
  const fy=H-420;
  x.textAlign='center';x.fillStyle='#5454AF';x.font=`700 60px ${F}`;
  x.fillText('إعداد المعلم',W-760,fy);x.fillStyle='#2E2E6E';x.font=`700 66px ${F}`;x.fillText('محمد هليل الشمري',W-760,fy+90);
  x.fillStyle='#5454AF';x.font=`700 60px ${F}`;x.fillText('مدير المدرسة',760,fy);x.fillStyle='#2E2E6E';x.font=`700 66px ${F}`;x.fillText('طلال خليف الشمري',760,fy+90);

  // الختم
  const cx=W/2,cy=fy+70;
  if(stamp){const sw2=640,sh2=sw2*stamp.height/stamp.width;x.globalAlpha=.92;x.drawImage(stamp,cx-sw2/2,cy-sh2/2,sw2,sh2);x.globalAlpha=1;}
  else{x.setLineDash([18,16]);x.strokeStyle='#B9B9D9';x.lineWidth=6;x.beginPath();x.ellipse(cx,cy,300,190,0,0,Math.PI*2);x.stroke();x.setLineDash([]);x.fillStyle='#9A9AB5';x.font=`400 48px ${F}`;x.fillText('موضع ختم المدرسة',cx,cy+16);}
  return cv;
}

    <label style="display:block"><input type="radio" name="stm" value="attached" ${S.stampMode==='attached'?'checked':''}> الختم المأخوذ من الشهادة المرفقة</label>
    <label style="display:block"><input type="radio" name="stm" value="custom" ${S.stampMode==='custom'?'checked':''} ${S.stampData?'':'disabled'}> صورة الختم الرسمي المرفوعة ${S.stampData?'✓':'(لم تُرفع بعد)'}</label>
    <label style="display:block"><input type="radio" name="stm" value="none" ${S.stampMode==='none'?'checked':''}> بدون صورة (يبقى موضع الختم فارغًا للختم عند الطباعة)</label>
    <label class="btn soft sm" style="margin-top:8px">رفع صورة الختم الرسمي<input type="file" id="stF" accept="image/png,image/jpeg,image/webp" class="sr"></label>
    <p class="hint">يفضّل ملف PNG بخلفية شفافة.</p></fieldset>
   <label class="field" style="display:flex;gap:10px;align-items:center;grid-column:1/-1"><input type="checkbox" id="sSig" ${S.showSig?'checked':''} style="width:24px;height:24px">إظهار توقيع مدير المدرسة (من الشهادة المرفقة)</label>
   <div class="field"><label for="sPin">تغيير رمز المعلم (اتركه فارغًا لعدم التغيير)</label><input id="sPin" class="inp" type="password" inputmode="numeric" minlength="4" autocomplete="new-password"></div>
   <div style="grid-column:1/-1"><button class="btn" type="submit">حفظ الإعدادات</button> <span id="setMsg" class="hint" aria-live="polite"></span></div></form>`;
  if(tab==='data')body=`<p>يحفظ الموقع التقدم في المتصفح على كل جهاز. لا توجد خدمة حفظ مشتركة مربوطة حاليًا، لذلك لا تتزامن الأجهزة تلقائيًا.</p>
   <h3>جمع التقدم من الأجهزة</h3><ol><li>على كل جهاز يستخدمه الطلاب: افتح لوحة المعلم ← «تصدير ملف تقدم هذا الجهاز».</li><li>على جهازك: «استيراد ملفات التقدم» واختر الملفات. يُدمج الأحدث لكل طالب.</li></ol>
   <div class="row"><button class="btn sm" data-exp>تصدير ملف تقدم هذا الجهاز (JSON)</button><label class="btn soft sm">استيراد ملفات التقدم<input type="file" id="impF" accept=".json,application/json" multiple class="sr"></label></div>
   <p id="impMsg" class="hint" aria-live="polite"></p>
   <h3>الأمان</h3><p class="hint">رمز المعلم يحمي اللوحة من الاستخدام العابر على الأجهزة المشتركة، لكنه يعمل داخل المتصفح وليس حماية كاملة كخادم موثّق. لا تُحفظ في الموقع أي بيانات حساسة عن الطلاب.</p>`;
  openModal(`<h2 id="mTitle">لوحة المعلم</h2>${tabs}<div id="tbody">${body}</div><div class="row end" style="margin-top:14px"><button class="btn ghost sm" data-lock>قفل اللوحة</button></div>`);
  const box=$('#mbox');
  box.addEventListener('click',async e=>{
    const t=e.target.closest('[data-tab]');if(t)return teacherPanel(t.dataset.tab);
    if(e.target.closest('[data-lock]')){teacherOK=false;closeModal();toast('قُفلت لوحة المعلم');}
    const r=e.target.closest('[data-reset]');if(r){const n=r.dataset.reset;if(r.dataset.sure){delete DB.students[n];try{localStorage.removeItem('draw_'+n)}catch(x){}if(DB.current===n){DB.current=null;}save();teacherPanel('stu');render();toast('صُفّر تقدم '+n);}else{r.dataset.sure=1;r.textContent='تأكيد التصفير؟';r.style.borderColor='#B4436C';}}
    if(e.target.closest('[data-csv]')){const H=['الطالب','المدرسة الملحقة','الحالة','محطة التعريف','الحقوق','العوالم (الأساسي)','الأنشطة الإثرائية','تاريخ الشهادة','آخر دخول'];const L=[H].concat(STUDENTS.map(n=>{const r=stuRow(n);return [r.n,r.school,r.st,r.intro==='✓'?'مكتملة':'—',r.rights,r.worlds,r.ex,r.cert,r.last];}));
      const csv='﻿'+L.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');saveFile(new Blob([csv],{type:'text/csv'}),'تقرير-مشاركة-يوم-الطفل.csv');}
    if(e.target.closest('[data-exp]')){const out={type:'childday2026',exported:new Date().toISOString(),students:DB.students};saveFile(new Blob([JSON.stringify(out)],{type:'application/json'}),'تقدم-يوم-الطفل-'+today()+'.json');}
  });
  const imp=$('#impF');if(imp)imp.onchange=async()=>{let n=0,bad=0;for(const f of imp.files){try{const d=JSON.parse(await f.text());if(d.type!=='childday2026')throw 0;for(const [k,v] of Object.entries(d.students||{})){if(!STUDENTS.includes(k))continue;const cur=DB.students[k];if(!cur||(v.last||'')>(cur.last||'')){DB.students[k]=v;n++;}}DB.importedFrom=DB.importedFrom||{};DB.importedFrom[f.name]=1;}catch(x){bad++;}}save();$('#impMsg').textContent=`دُمج ${n} سجل طالب${bad?`، وتعذّرت قراءة ${bad} ملف`:''}.`;};
  const st=$('#stF');if(st)st.onchange=()=>{const f=st.files[0];if(!f)return;if(f.size>3e6){toast('الصورة كبيرة جدًا (أكثر من 3 ميجابايت)');return;}const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,900/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);DB.settings.stampData=c.toDataURL('image/png');DB.settings.stampMode='custom';save();lastCert=null;teacherPanel('set');toast('رُفعت صورة الختم');};i.src=r.result;};r.readAsDataURL(f);};
  const sf=$('#setF');if(sf)sf.onsubmit=async e=>{e.preventDefault();const S=DB.settings;S.eventDate=$('#sEv').value||S.eventDate;S.actStart=$('#sA1').value||S.actStart;S.actEnd=$('#sA2').value||S.actEnd;S.worldsRequired=+$('#sW').value;S.requireIntro=$('#sRI').checked;S.requireRights=$('#sRR').checked;S.stampMode=(sf.querySelector('[name=stm]:checked')||{}).value||S.stampMode;S.showSig=$('#sSig').checked;
    const p=$('#sPin').value.trim();if(p){if(p.length<4){$('#setMsg').textContent='الرمز يجب أن يكون 4 أرقام على الأقل.';return;}S.pinHash=await hash(p);}
    save();lastCert=null;$('#setMsg').textContent='حُفظت الإعدادات ✓';render();};
}

/* ===== التشغيل ===== */
load();
$('#hdrLogo').src=A.logo;
document.body.classList.toggle('rm',!!DB.ui.rm);$('#motionBtn').setAttribute('aria-pressed',!!DB.ui.rm);
$('#motionBtn').onclick=()=>{DB.ui.rm=!DB.ui.rm;document.body.classList.toggle('rm',DB.ui.rm);$('#motionBtn').setAttribute('aria-pressed',DB.ui.rm);save();toast(DB.ui.rm?'تم تقليل الحركة':'أُعيدت الحركة');};
$('#homeBtn').onclick=()=>go(DB.current?'home':'login');
$('#switchBtn').onclick=()=>{DB.current=null;save();go('login');toast('اختر اسم الطالب التالي');};
$('#teacherBtn').onclick=()=>teacherOK?teacherPanel('stu'):teacherLogin();
if(DB.current&&STUDENTS.includes(DB.current))route={v:'home'};else DB.current=null;
render();

</script>
</body>
</html>
